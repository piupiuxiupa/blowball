# blowball Redis 哨兵集群 —— 主节点配置(初始主:node1)
# 部署到 node1 的 /etc/redis/redis.conf(占位符见 docs/redis-ha-deployment.md §3)
#
# 与 redis-replica.conf 仅两处不同:bind 的本机 IP、没有 replicaof 行。
# 注意:本文件必须对运行用户(redis)可写 —— 哨兵切换后会对各节点执行
# REPLICAOF + CONFIG REWRITE,把拓扑变化落回本文件。

## ── 网络 ─────────────────────────────────────────────────────────────
bind 127.0.0.1 10.0.0.11          # <- 替换为本机内网 IP
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

## ── 进程 ─────────────────────────────────────────────────────────────
daemonize no                       # systemd(Type=simple)前台管理
supervised no
pidfile /run/redis/redis-server.pid
loglevel notice
logfile ""                         # 日志走 stderr -> journald
databases 16
dir /var/lib/redis                 # AOF/RDB 落盘目录

## ── 认证 ─────────────────────────────────────────────────────────────
requirepass <REDIS_PASSWORD>       # <- 替换为强密码
# 主节点也必须配 masterauth:failover 后哨兵会把旧主降级为副本,
# 它需要凭 masterauth 对新主认证(哨兵部署最常见的漏配项)。
masterauth <REDIS_PASSWORD>

## ── 持久化(红线)─────────────────────────────────────────────────────
# msgs:buffer 是消息的唯一同步层,必须开 AOF;关掉会丢 flush 窗口内的消息,
# blowball 启动探测(CONFIG GET appendonly)会打 WARN。
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
# always:本 Redis 同时承载 JuiceFS 元数据(docs/redis-ha-deployment.md §2),
# 元数据丢一秒 = 数据块与索引不一致的风险,取 always。blowball 每 turn 一个
# MULTI,fsync 量级 = turn 数 + 元数据写次数,普通 SSD 可扛。
# 若采用同机双实例布局且本实例只服务 blowball,可退回 everysec
# (丢失窗口与 messages.flush_interval 的 1s 对齐,且有 MySQL 回退兜底)。
appendfsync always
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes
# RDB 作为冷备/快照兜底
save 3600 1 300 100 60 10000
stop-writes-on-bgsave-error yes
dbfilename dump.rdb

## ── 内存(红线)───────────────────────────────────────────────────────
# 双重理由:队列 key 是业务数据,绝不允许淘汰;JuiceFS 对元数据引擎也硬性
# 要求 noeviction(启动时尝试自动设置,失败仅 WARN,不能依赖)。
# 打满表现为拒写:blowball 降级直写 MySQL(安全),但 JuiceFS 元数据写失败
# = 文件系统不可写,workspace 全停(§4.2)—— 必须留余量并配告警。
maxmemory 4gb                      # <- 覆盖 blowball key 族 + JuiceFS 元数据
                                    #    (~300 字节/文件,juicefs status 看实际),
                                    #    ×2~3 余量(§7)
maxmemory-policy noeviction

## ── 复制 ─────────────────────────────────────────────────────────────
# 初始主不设 replicaof;哨兵切换时通过 REPLICAOF 调整各节点角色。
# 没有健康副本时主节点拒写,缩小 failover 丢数据窗口;代价是切换后的
# 几秒新主可能拒写(blowball 走 MySQL 回退)。可用性优先可注释掉这两行。
min-replicas-to-write 1
min-replicas-max-lag 10
replica-read-only yes
repl-diskless-sync yes
repl-backlog-size 64mb
# 多网卡/NAT 部署时显式广播本机地址(直连内网不需要):
# replica-announce-ip 10.0.0.11
# replica-announce-port 6379

## ── 观测 ─────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 100
