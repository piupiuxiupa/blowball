# blowball Redis 哨兵集群 —— 副本配置(node2 / node3,两台内容相同)
# 部署到 node2、node3 的 /etc/redis/redis.conf(占位符见 docs/redis-ha-deployment.md §3)
#
# 与 redis-master.conf 仅两处不同:bind 的本机 IP、多一行 replicaof。
# 注意:本文件必须对运行用户(redis)可写 —— 哨兵切换后会对各节点执行
# REPLICAOF + CONFIG REWRITE;被提升为新主的副本,其 replicaof 行会被清掉。

## ── 网络 ─────────────────────────────────────────────────────────────
bind 127.0.0.1 10.0.0.12          # <- 替换为本机内网 IP(node3 用自己的)
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

## ── 进程 ─────────────────────────────────────────────────────────────
daemonize no                       # systemd(Type=simple)前台管理
supervised no
pidfile /run/redis/redis-server.pid
loglevel notice
logfile ""                         # 日志走 stderr -> journald
databases 16
dir /var/lib/redis                 # AOF/RDB 落盘目录

## ── 认证 ─────────────────────────────────────────────────────────────
requirepass <REDIS_PASSWORD>       # <- 替换为强密码(三台一致)
# 对主节点认证;failover 中本机被提升为主后此配置暂不生效,再被降级时继续用
masterauth <REDIS_PASSWORD>

## ── 持久化(红线)─────────────────────────────────────────────────────
# 副本同样开 AOF:被提升为主后它就是唯一同步层;重启重连主期间也靠本地 AOF。
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
# always:本 Redis 同时承载 JuiceFS 元数据(§2),元数据丢一秒 = 数据块与
# 索引不一致的风险。若采用双实例布局且本实例只服务 blowball,可退回
# everysec(与 messages.flush_interval 对齐,有 MySQL 回退兜底)。
appendfsync always
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes
save 3600 1 300 100 60 10000
stop-writes-on-bgsave-error yes
dbfilename dump.rdb

## ── 内存(红线)───────────────────────────────────────────────────────
# 覆盖 blowball key 族 + JuiceFS 元数据(~300 字节/文件,只增不减,
# juicefs status 看实际用量),×2~3 余量(§7)。
maxmemory 4gb                      # <- 三台保持一致(故障转移后任何一台都可能成为主)
maxmemory-policy noeviction        # 队列是业务数据 + JuiceFS 硬性要求,禁止淘汰

## ── 复制 ─────────────────────────────────────────────────────────────
replicaof 10.0.0.11 6379           # <- 初始主(node1);切换由哨兵接管
replica-read-only yes
repl-diskless-sync yes
repl-backlog-size 64mb
# 多网卡/NAT 部署时显式广播本机地址(直连内网不需要):
# replica-announce-ip 10.0.0.12
# replica-announce-port 6379

## ── 观测 ─────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 100
