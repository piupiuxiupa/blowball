# blowball Redis 哨兵配置(三台各一份,仅 bind / announce-ip 不同)
# 部署到 /etc/redis/sentinel.conf,以 redis 用户运行(docs/redis-ha-deployment.md §6)
#
# 注意:哨兵运行时会重写本文件(记录纪元、已发现的副本与哨兵),
# 该文件必须对运行用户可写 —— 这不是错误,是哨兵的正常行为。

port 26379
bind 127.0.0.1 10.0.0.11          # <- 替换为本机内网 IP
protected-mode yes
dir /var/lib/redis

# 监控的 master 名字固定为 blowball-master —— 与 blowball 配置里的
# redis.sentinel.master_name 一致(§5 路线 A)。quorum=2:3 个哨兵中 2 个
# 同意才判死并授权切换。
sentinel monitor blowball-master 10.0.0.11 6379 2   # <- 初始主 IP

# 数据节点密码(三台 redis-server 的 requirepass)
sentinel auth-pass blowball-master <REDIS_PASSWORD>

# 5s 无响应判死;端到端切换约 10~20s
sentinel down-after-milliseconds blowball-master 5000
# 切换重试的抑制窗口
sentinel failover-timeout blowball-master 30000
# 切换后一次只重同步一个副本,切换期间保持一个副本在线服务
sentinel parallel-syncs blowball-master 1

# 多网卡/NAT 部署时显式广播本机地址(直连内网不需要):
# sentinel announce-ip 10.0.0.11
# sentinel announce-port 26379

# 哨兵进程自身的认证(Redis >=6.2,可选加固,见 docs/redis-ha-deployment.md §11):
# sentinel sentinel-user blowball-sentinel
# sentinel sentinel-pass <SENTINEL_PASSWORD>

# ── 同机双实例布局(docs/redis-ha-deployment.md §2.2)──────────────────
# 该 Redis 同时承载 JuiceFS 元数据时,生产推荐每台再起一个 6380 实例
# (独立主从),同一组哨兵同时监控第二个 master —— 取消下面注释并替换 IP。
# JuiceFS 的 meta URL 相应使用:
#   redis://:<REDIS_PASSWORD>@juicefs-master,<哨兵1>,<哨兵2>,<哨兵3>:26379/5
# sentinel monitor juicefs-master 10.0.0.11 6380 2
# sentinel auth-pass juicefs-master <REDIS_PASSWORD>
# sentinel down-after-milliseconds juicefs-master 5000
# sentinel failover-timeout juicefs-master 30000
# sentinel parallel-syncs juicefs-master 1
