version: "3.8"
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: blowball
      MYSQL_USER: blowball
      MYSQL_PASSWORD: blowballpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
  redis:
    image: redis:7-alpine
    # AOF 对齐生产红线:msgs:buffer 是消息的唯一同步层,关掉会在重启时
    # 丢 flush 窗口的消息,且 blowball 启动探测会打 WARN。
    # HA 拓扑(哨兵集群)见 deploy/redis-ha/ 与 docs/redis-ha-deployment.md。
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  mysql_data:
  redis_data:
