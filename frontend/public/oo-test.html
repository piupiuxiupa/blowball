<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnlyOffice 连接测试</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; }
    #log { padding: 10px; font: 12px/1.5 ui-monospace, monospace; background: #fff3f3;
           white-space: pre-wrap; max-height: 220px; overflow: auto; border-bottom: 1px solid #fbb; }
    #placeholder { width: 100%; height: 70vh; }
    h3 { margin: 0; padding: 10px; background: #f3f4f6; font-size: 14px; }
  </style>
</head>
<body>
  <h3>OnlyOffice 连接测试（独立页面，不经过 React）。把下面日志区的文字发给我。</h3>
  <div id="log"></div>
  <div id="placeholder"></div>
  <script>
    // ---- on-screen logger ----
    const logEl = document.getElementById('log');
    function log(msg) {
      const t = new Date().toLocaleTimeString();
      logEl.textContent += `[${t}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
      console.log('[oo-test]', msg);
    }
    window.addEventListener('error', (e) => log('!! window error: ' + e.message + ' @ ' + (e.filename||'') + ':' + (e.lineno||'')));
    window.addEventListener('unhandledrejection', (e) =>
      log('!! unhandled rejection: ' + ((e.reason && (e.reason.message || JSON.stringify(e.reason))) || e.reason))
    );

    // ---- config (hardcoded local-dev values, mirrors src/lib/onlyoffice.ts) ----
    const API_SCRIPT = 'http://localhost/web-apps/apps/api/documents/api.js';
    const INTERNAL_BACKEND = 'http://10.1.152.201:8080';
    const SECRET = '4Cor7UDd0GmWdrKWH3VoNya2xDjv3JAF';

    // ---- HS256 JWT signing (same as the app, Web Crypto, no deps) ----
    function base64Url(bytes) {
      let bin = '';
      for (const b of bytes) bin += String.fromCharCode(b);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    async function signToken(config) {
      const enc = new TextEncoder();
      const h = base64Url(enc.encode(JSON.stringify({ alg: 'HS256', typ: 'JWT' })));
      const p = base64Url(enc.encode(JSON.stringify(config)));
      const data = h + '.' + p;
      const key = await crypto.subtle.importKey('raw', enc.encode(SECRET),
        { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
      const sig = new Uint8Array(await crypto.subtle.sign('HMAC', key, enc.encode(data)));
      return data + '.' + base64Url(sig);
    }

    // ---- read auth token from the app's localStorage (same origin) ----
    let token = '';
    try {
      const raw = localStorage.getItem('blowball-auth');
      token = raw ? JSON.parse(raw).state.token : '';
    } catch (e) { log('could not read token from localStorage: ' + e.message); }
    log('auth token from localStorage: ' + (token ? token.slice(0, 24) + '… (' + token.length + ' chars)' : '(EMPTY — are you logged in at / ?)'));

    // file path can be overridden via ?file=...
    const params = new URLSearchParams(location.search);
    const file = params.get('file') || '20032508-5bd2-45e1-a0e5-39cac2eb7f4a.xls';
    const ext = file.split('.').pop().toLowerCase();
    const documentType = (ext === 'docx' || ext === 'doc') ? 'word'
                       : (ext === 'xlsx' || ext === 'xls') ? 'cell'
                       : (ext === 'pptx' || ext === 'ppt') ? 'slide' : 'cell';
    const docUrl = INTERNAL_BACKEND + '/api/v1/workspace/files/download/' + encodeURIComponent(file) + '?inline=1&token=' + token;
    log('documentType=' + documentType + '  file=' + file);
    log('document.url (DocumentServer will fetch this): ' + docUrl);

    async function boot() {
      log('loading api.js: ' + API_SCRIPT);
      const s = document.createElement('script');
      s.src = API_SCRIPT;
      s.async = true;
      s.onload = async () => {
        log('api.js loaded. window.DocsAPI present? ' + (!!window.DocsAPI));
        if (!window.DocsAPI) { log('FAIL: DocsAPI missing after api.js load'); return; }
        const config = {
          documentType,
          document: { fileType: ext, key: 'standalone-' + file, title: file, url: docUrl,
                      permissions: { edit: false, download: true } },
          editorConfig: { mode: 'view', lang: 'zh', user: { id: 'local', name: '本地用户' } },
        };
        let signed;
        try { signed = await signToken(config); log('token signed OK (' + signed.length + ' chars)'); }
        catch (e) { log('!! signToken failed: ' + e.message + ' (crypto.subtle needs a secure context)'); return; }
        try {
          const editor = new window.DocsAPI.DocEditor('placeholder', {
            ...config, token: signed, width: '100%', height: '100%',
            events: {
              onAppReady: () => log('EVENT onAppReady ✓ 编辑器已就绪（连接成功）'),
              onDocumentReady: () => log('EVENT onDocumentReady ✓ 文档已加载（渲染成功）'),
              onError: (e) => log('EVENT onError: ' + JSON.stringify(e)),
            },
          });
          log('new DocEditor() returned without throwing. Waiting for onAppReady…');
          setTimeout(() => log('(20s) 仍未收到 onAppReady —— 连接未建立'), 20000);
        } catch (e) { log('!! new DocEditor() threw: ' + e.message); }
      };
      s.onerror = () => log('!! api.js 加载失败 —— 浏览器到 http://localhost 的网络有问题');
      document.head.appendChild(s);
    }
    boot();
  </script>
</body>
</html>
