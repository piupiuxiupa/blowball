openapi: 3.0.3
info:
  title: blowball Multi-Agent Backend API
  version: "1.2.0"
  description: |
    HTTP API surface for the blowball multi-agent backend.

    Authentication is JWT Bearer. All routes except `/auth/login` require an
    `Authorization: Bearer <token>` header. Errors follow the unified envelope
    `{"error": {"code": "ERROR_CODE", "message": "..."}}`.

    1.1.0 — turn-detach-resume (disconnecting from an SSE stream no longer
    cancels the turn; run ids, session-busy 409, cancel/resume-by-run-id
    endpoints, `generating`/`run_id` on the session list) and
    per-request-model-selection (`model`/`reasoning_effort` request params,
    `GET /api/v1/models`).

    1.2.0 — per-run dynamic sub-agent transcript snapshots and lazily loaded
    sub-agent run list/detail endpoints.

    Workspace file endpoints are transparent to the physical storage backend:
    requests and responses are identical whether `storage.workspace.backend` is
    `local` (per-process local disk) or `shared` (an operator-mounted shared
    POSIX filesystem such as MinIO-backed JuiceFS). The backend selection only
    changes where files physically live; it does not alter this contract.
servers:
  - url: http://localhost:8080
    description: Local development server
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token issued by POST /api/v1/auth/login.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: BAD_REQUEST
            message:
              type: string
              description: Human-readable error description.
              example: invalid request body
    LoginRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
        password:
          type: string
          description: >-
            User password, verified against the seed-created bcrypt hash.
            Required only when auth.password_required is true (the default);
            in passwordless mode the password, if sent, is ignored.
    LoginResponse:
      type: object
      required: [user_id, access_token, expire, token_type]
      properties:
        user_id:
          type: string
          description: The authenticated user's unique ID.
        access_token:
          type: string
          description: Signed JWT to send as `Bearer` in subsequent requests.
        expire:
          type: integer
          format: int64
          description: Token expiry as a Unix timestamp (seconds).
        token_type:
          type: string
          enum: [Bearer]
          example: Bearer
    SessionListEntry:
      type: object
      required: [session_id, title, update_time, generating]
      properties:
        session_id:
          type: string
        title:
          type: string
        update_time:
          type: string
          format: date-time
          description: RFC3339 timestamp of the last update.
        generating:
          type: boolean
          description: |
            Whether a turn is currently running for this session
            (turn-detach-resume). True while the session's active-run claim
            exists; clients use it to offer resume (attach to
            `turns/{run_id}/events`) and a cancel affordance. The server
            attempts terminal message persistence (and a bounded MySQL drain)
            before releasing that claim, so a healthy transition to false
            means the completed turn is visible in message history.
        run_id:
          type: string
          description: |
            The active turn's run id — the attach/cancel target. Present only
            while `generating` is true. This is the reload discovery path: a
            reloaded page has lost the `X-Run-Id` header and event meta it
            saw when the turn started, so it recovers the run id from here.
    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionListEntry'
    SessionDetail:
      type: object
      description: |
        Single-session read (GET /api/v1/sessions/{session_id}) — the
        SessionListEntry superset plus create_time.
      required: [session_id, title, create_time, update_time, generating]
      properties:
        session_id:
          type: string
        title:
          type: string
        create_time:
          type: string
          format: date-time
          description: RFC3339 timestamp of session creation.
        update_time:
          type: string
          format: date-time
          description: RFC3339 timestamp of the last update.
        generating:
          type: boolean
          description: |
            Whether a turn is currently running for this session
            (turn-detach-resume) — same active-run-claim semantics as the
            session list. The active-run claim is released only after terminal
            message persistence has been attempted; an unreadable claim
            degrades to false.
        run_id:
          type: string
          description: |
            The active turn's run id — the attach/cancel target. Present only
            while `generating` is true (the reload discovery path).
    CreateSessionResponse:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
          format: uuid
          description: Server-generated UUID v7 session identifier.
          example: 018f9b8a-7c1a-7e6a-8e6a-6c1a7c1a7c1a
    Message:
      type: object
      required: [id, session_id, msg_time, agent, msg_index, role, event_type, content, trace_id, update_time]
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: string
          format: uuid
        msg_time:
          type: string
          format: date-time
        agent:
          type: string
          enum: [user, Confucius, Chongzhi, Liang]
        msg_index:
          type: integer
        role:
          type: string
          enum: [user, assistant, tool, ""]
        event_type:
          type: string
          enum: [message, token, tool_call, tool_result, plan_updated, agent_start, agent_end, agent_error, reasoning]
        content:
          type: string
        trace_id:
          type: string
          format: uuid
        client_msg_id:
          type: string
          nullable: true
          description: >
            Idempotency key minted at persistence time. Backs the Redis-first
            write-behind delivery: duplicate insert attempts of the same
            logical message collapse to one row. Rows carry either a
            deterministic "{trace_id}:{msg_index}" key (the send-time user
            row, incremental closed-event batches, mid-turn compaction
            batches, and terminal suffix batches) or a UUID v7 (legacy
            write-behind minting). Null on rows written before migration 012.
        agent_instance_id:
          type: string
          nullable: true
          description: >
            Stable dynamic sub-agent instance identity. It survives resume and
            groups one thread across multiple run_id values. Present only on
            dynamic sub-agent rows; top-level/user rows and rows written before
            migration 016 are null.
        run_id:
          type: string
          nullable: true
          description: >
            Sub-agent invocation run identity (subagent-run-identity
            capability): the id of the parent spawn_subagent tool_call that spawned
            the producing Run. Present only on rows emitted by a sub-agent
            (dynamic instances); Confucius top-level rows and user rows omit it,
            and rows written before migration 014 are null. Rows stay in
            arrival order (msg_time, msg_index) — consumers regroup
            interleaved same-agent rows by (agent, agent_instance_id) to recover each
            invocation's coherent output.
        update_time:
          type: string
          format: date-time
    SessionMessagesResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_page_token:
          type: string
          description: Opaque cursor for the next page. Absent on the final page.
    SubAgentToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id:
          type: string
          description: Tool call id used for result pairing.
        name:
          type: string
          description: Tool function name.
        arguments:
          type: object
          additionalProperties: true
          description: Decoded tool-call arguments. Empty arguments are `{}`.
    SubAgentTranscriptItem:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [task, assistant, tool_result]
          description: |
            Frontend transcript kind. Internal system messages and unknown
            model roles are never exposed by this API.
        content:
          type: string
          description: Task text, assistant answer text, or tool result text.
        reasoning_content:
          type: string
          description: Assistant reasoning text, when captured in the model-context delta.
        tool_calls:
          type: array
          description: Tool calls emitted by this assistant message.
          items:
            $ref: '#/components/schemas/SubAgentToolCall'
        tool_call_id:
          type: string
          description: ID pairing a tool result with its assistant tool call.
        name:
          type: string
          description: Tool name on a tool-result item.
    SubAgentRunSummary:
      type: object
      required:
        - agent_instance_id
        - run_id
        - run_no
        - name
        - status
        - message_count
        - started_at
        - finished_at
      properties:
        agent_instance_id:
          type: string
          description: Stable sub-agent instance/thread identity.
        run_id:
          type: string
          description: One dispatch identity; equals the parent spawn tool_call id.
        previous_run_id:
          type: string
          description: Predecessor run when this execution resumed an instance.
        run_no:
          type: integer
          minimum: 1
          description: Linear execution number within the instance.
        name:
          type: string
          description: Stable sub-agent attribution label.
        status:
          type: string
          enum: [completed, capped, error]
        message_count:
          type: integer
          description: Number of messages in this run's persisted delta.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    SubAgentRunListResponse:
      type: object
      required: [runs]
      example:
        runs:
          - agent_instance_id: w-9f2d4c
            run_id: call_019glegacy
            run_no: 1
            name: researcher#w-9f2d4c
            status: completed
            message_count: 4
            started_at: '2026-09-07T01:00:00Z'
            finished_at: '2026-09-07T01:02:00Z'
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/SubAgentRunSummary'
    SubAgentRunDetail:
      allOf:
        - $ref: '#/components/schemas/SubAgentRunSummary'
        - type: object
          required: [transcript]
          properties:
            transcript:
              type: array
              description: |
                Sanitized frontend transcript for this terminal run. New rows
                contain only that run's delta; a legacy full-snapshot row
                contains the retained instance baseline.
              items:
                $ref: '#/components/schemas/SubAgentTranscriptItem'
      example:
        agent_instance_id: w-9f2d4c
        run_id: call_019glegacy
        previous_run_id: call_019gprevious
        run_no: 2
        name: researcher#w-9f2d4c
        status: completed
        message_count: 3
        started_at: '2026-09-07T01:05:00Z'
        finished_at: '2026-09-07T01:07:00Z'
        transcript:
          - type: task
            content: Continue the investigation.
          - type: assistant
            content: I found the regression.
            reasoning_content: Compare the two call sites first.
            tool_calls:
              - id: call_tool_1
                name: executor
                arguments: {command: rg regression}
          - type: tool_result
            tool_call_id: call_tool_1
            name: executor
            content: two matches
    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          description: User message text (must be non-empty).
        model:
          type: string
          description: |
            Selects the turn's model from the mandatory `openai.models`
            catalog (per-request-model-selection). The selection applies
            uniformly to all three agents; omitted → the default entry
            (`openai.default_model`, else the first entry). Unknown names
            return 400 `INVALID_MODEL`.
        reasoning_effort:
          type: string
          enum: [none, low, medium, high, xhigh, max]
          description: |
            Selects the turn's thinking level; omitted → the deployment
            default (`openai.default_reasoning_effort`, itself defaulting to
            `none`). On a `thinking: true` entry, `none` is sent to the
            provider as a literal value (it does NOT mean "omit the
            parameter") — compatible gateways then disable thinking for the
            turn. A non-`none` value explicitly requested on a
            `thinking: false` entry returns 400 `INVALID_EFFORT`; a
            non-`none` deployment default landing on such an entry is clamped
            to `none` (WARN) and the turn proceeds.
    TurnStatusResponse:
      type: object
      required: [run_id, status]
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [cancelling, running, done, error, cancelled, interrupted]
          description: |
            `cancelling` — accepted; the owning process will finalize the run
            (persisting partial output). The remaining values are terminal
            states reported by idempotent cancels of finished runs.
    # ---- SSE event payloads -------------------------------------------------
    # Every sub-agent-produced event additionally carries the optional
    # meta.parent_tool_call_id (subagent-run-identity capability): the id of
    # the parent spawn_subagent tool_call that spawned the emitting Run. It lets
    # consumers attribute interleaved parallel same-name invocations; events
    # from the top-level agent (Confucius) and user rows never carry it, and
    # older frontends simply ignore the unknown key.
    SSEAgentStart:
      type: object
      required: [type, agent]
      properties:
        type: {type: string, enum: [agent_start]}
        agent: {type: string}
        meta:
          type: object
          properties:
            parent_tool_call_id: {type: string, description: Present only on sub-agent events; the parent spawn_subagent tool_call id (run identity).}
            agent_instance_id: {type: string, description: Stable sub-agent instance identity; survives resume and groups threads across parent_tool_call_id values.}
            run_id: {type: string, description: The owning turn run id; present on every event frame (turn-detach-resume).}
    SSEToken:
      type: object
      required: [type, agent, content]
      properties:
        type: {type: string, enum: [token]}
        agent: {type: string}
        content: {type: string, description: Incremental text token.}
        meta:
          type: object
          properties:
            parent_tool_call_id: {type: string, description: Present only on sub-agent events; the parent spawn_subagent tool_call id (run identity).}
            agent_instance_id: {type: string, description: Stable sub-agent instance identity; survives resume and groups threads across parent_tool_call_id values.}
            run_id: {type: string, description: The owning turn run id; present on every event frame (turn-detach-resume).}
    SSEReasoning:
      type: object
      required: [type, agent, content]
      properties:
        type: {type: string, enum: [reasoning]}
        agent: {type: string}
        content: {type: string, description: Incremental reasoning/thinking token.}
        meta:
          type: object
          properties:
            parent_tool_call_id: {type: string, description: Present only on sub-agent events; the parent spawn_subagent tool_call id (run identity).}
            agent_instance_id: {type: string, description: Stable sub-agent instance identity; survives resume and groups threads across parent_tool_call_id values.}
            run_id: {type: string, description: The owning turn run id; present on every event frame (turn-detach-resume).}
    SSEToolCall:
      type: object
      required: [type, agent, content]
      properties:
        type: {type: string, enum: [tool_call]}
        agent: {type: string}
        content: {type: string, description: Tool name.}
        meta:
          type: object
          required: [tool_call_id]
          properties:
            tool_call_id: {type: string, description: Correlates this call with its tool_result event.}
            args: {type: object, additionalProperties: true}
            parent_tool_call_id: {type: string, description: Present only on sub-agent events; the parent spawn_subagent tool_call id (run identity).}
            agent_instance_id: {type: string, description: Stable sub-agent instance identity; survives resume and groups threads across parent_tool_call_id values.}
            run_id: {type: string, description: The owning turn run id; present on every event frame (turn-detach-resume).}
    SSEToolResult:
      type: object
      required: [type, agent, content]
      description: |
        Outcome of a tool invocation. Pairs with the preceding `tool_call` event
        via `meta.tool_call_id`. `content` is the same string fed back to the
        model as the role="tool" message body: for registry tools the uniform
        status envelope `{"status":0,"result":...}` / `{"status":1,"error":...}`;
        for spawn_subagent dispatches, the sub-agent's output (or error text)
        followed by a machine-readable `agent_id` and `status` suffix
        (`completed`, `capped`, or `error`). The status envelope is the sole channel for a registry-tool
        failure: no `agent_error` event is emitted for tool errors (the frontend
        renders tool errors from `content`'s `status` field).
      properties:
        type: {type: string, enum: [tool_result]}
        agent: {type: string}
        content: {type: string, description: "Serialized tool result (status/result envelope), sub-agent output, or error text."}
        meta:
          type: object
          required: [tool_call_id]
          properties:
            tool_call_id: {type: string, description: Matches the meta.tool_call_id of the originating tool_call event.}
            parent_tool_call_id: {type: string, description: Present only on sub-agent events; the parent spawn_subagent tool_call id (run identity).}
            agent_instance_id: {type: string, description: Stable sub-agent instance identity; survives resume and groups threads across parent_tool_call_id values.}
            run_id: {type: string, description: The owning turn run id; present on every event frame (turn-detach-resume).}
    SSEPlanUpdated:
      type: object
      required: [type, agent, content, meta]
      description: |
        Host-accepted semantic plan snapshot submitted through Confucius's
        root-only `update_plan` tool. The event is emitted between the
        `update_plan` tool_call and tool_result and before any same-round
        sub-agent or registry activity. `content` is canonical JSON (encoded as
        a string) with the SSEPlanSnapshot shape so it survives message
        persistence. Multiple steps may simultaneously be `in_progress` for
        parallel dispatch.
      properties:
        type: {type: string, enum: [plan_updated]}
        agent: {type: string, description: Root orchestrator label (normally Confucius).}
        content:
          type: string
          description: Canonical JSON-encoded SSEPlanSnapshot.
          example: '{"revision":1,"steps":[{"step":"Inspect stream events","status":"completed"},{"step":"Design plan state","status":"in_progress"}],"explanation":"Investigation finished."}'
        meta:
          type: object
          required: [revision]
          properties:
            revision: {type: integer, minimum: 1, description: Host-assigned snapshot revision; ignored during persistence in favor of the canonical content.}
            run_id: {type: string, description: The owning turn run id; present on every event frame (turn-detach-resume).}
    SSEPlanSnapshot:
      type: object
      required: [revision, steps]
      properties:
        revision: {type: integer, minimum: 1, description: Monotonic per-turn revision assigned by the host.}
        steps:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/SSEPlanStep'
        explanation:
          type: string
          maxLength: 2000
          description: Optional reason for the plan change.
    SSEPlanStep:
      type: object
      required: [step, status]
      properties:
        step: {type: string, minLength: 1, maxLength: 1000}
        status: {type: string, enum: [pending, in_progress, completed]}
    SSEAgentEnd:
      type: object
      required: [type, agent]
      properties:
        type: {type: string, enum: [agent_end]}
        agent: {type: string}
        meta:
          type: object
          properties:
            parent_tool_call_id: {type: string, description: Present only on sub-agent events; the parent spawn_subagent tool_call id (run identity).}
            agent_instance_id: {type: string, description: Stable sub-agent instance identity; survives resume and groups threads across parent_tool_call_id values.}
            run_id: {type: string, description: The owning turn run id; present on every event frame (turn-detach-resume).}
    SSEAgentError:
      type: object
      required: [type, agent, content]
      description: |
        An agent-level failure or control signal. NOT emitted for registry-tool
        failures (those are carried solely by the SSEToolResult status envelope).
        `meta.error_code` is one of: `llm_error` (LLM call failed), `unknown_tool`
        (no tool registry / unknown sub-agent tool), `bad_args` (malformed
        sub-agent spawn argument error), `retry` (in-progress sub-agent retry, paired
        with `meta.retry=true`), `round_cap_exhausted` (round-cap wrap-up round
        produced no content), `budget_exhausted` (total/depth spawn budget), or
        `budget_timeout` (FIFO concurrency-slot wait timed out).
      properties:
        type: {type: string, enum: [agent_error]}
        agent: {type: string}
        content: {type: string, description: Error message.}
        meta:
          type: object
          properties:
            error_code: {type: string}
            parent_tool_call_id: {type: string, description: Present only on sub-agent events; the parent spawn_subagent tool_call id (run identity).}
            agent_instance_id: {type: string, description: Stable sub-agent instance identity; survives resume and groups threads across parent_tool_call_id values.}
            run_id: {type: string, description: The owning turn run id; present on every event frame (turn-detach-resume).}
    SSEDone:
      type: object
      required: [type, meta]
      properties:
        type: {type: string, enum: [done]}
        meta:
          type: object
          required: [usage]
          properties:
            usage:
              description: |
                Per-turn token-usage breakdown. Authoritative shape (turn-cost-tracking
                spec): `{total, by_agent, meta}`.

                `total` is the aggregate turn usage. `by_agent` carries per-agent
                attribution keyed by dynamic instance label (always includes
                "Confucius", plus one label per spawned instance; resume reuses the
                same label/key). `meta` records turn-level orchestration facts:
                `parallel` (true when any assistant round dispatched >=2 tool_calls)
                and `sub_agent_invocations` (objects carrying stable instance id,
                parent instance id, and dispatch order).

                Legacy flat top-level fields (`prompt_tokens`, `completion_tokens`,
                `total_tokens`, `reasoning_tokens`) have been MOVED under `total`;
                consumers reading `usage.total_tokens` must migrate to
                `usage.total.total_tokens`.
              type: object
              required: [total, by_agent, meta]
              properties:
                total:
                  $ref: '#/components/schemas/SSEUsageTokens'
                by_agent:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/SSEUsageTokens'
                  description: Usage keyed by dynamic instance labels such as name#shortid or subagent-shortid; resume reuses one key.
                meta:
                  type: object
                  required: [sub_agent_invocations, parallel]
                  properties:
                    sub_agent_invocations:
                      type: array
                      items:
                        $ref: '#/components/schemas/SSESubAgentInvocation'
                      description: Every spawn dispatch this turn, in dispatch order; resume is a new entry reusing its instance id.
                    parallel:
                      type: boolean
                      description: True when any assistant round dispatched >=2 tool_calls.
                error:
                  type: string
                  description: Present only when the turn completed with an error; the failure message.
    SSESubAgentInvocation:
      type: object
      required: [agent_instance_id, order]
      properties:
        agent_instance_id: {type: string, description: Stable dynamic sub-agent instance identity.}
        parent_instance_id: {type: string, description: Empty for root dispatches; otherwise the spawning sub-agent instance.}
        order: {type: integer, description: One-based dispatch order within the turn.}
    SSEUsageTokens:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: {type: integer}
        completion_tokens: {type: integer}
        total_tokens: {type: integer}
        reasoning_tokens:
          type: integer
          description: Present only for thinking/reasoning runs (reasoning_tokens > 0).
    FileEntry:
      type: object
      required: [name, type, size, update_time]
      properties:
        name: {type: string}
        type: {type: string, enum: [file, dir]}
        size: {type: integer, format: int64}
        update_time:
          type: string
          format: date-time
    FileListResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileEntry'
    WorkspaceSearchEntry:
      type: object
      required: [path, name, type, size, update_time]
      description: One matched entry in a GET /workspace/search page.
      properties:
        path:
          type: string
          description: Path relative to the search root ('/'-separated).
        name: {type: string, description: Basename of the entry.}
        type: {type: string, enum: [file, dir]}
        size:
          type: integer
          format: int64
          description: Bytes; 0 when the entry vanished before the stat (TOCTOU degrade).
        update_time:
          type: string
          format: date-time
          description: RFC3339 UTC mtime; "" when the entry vanished before the stat.
    WorkspaceSearchResponse:
      type: object
      required: [pattern, total, truncated, applied_limit, applied_offset, entries]
      properties:
        pattern:
          type: string
          description: The caller's raw pattern input (never the escaped regex).
        total:
          type: integer
          description: Match count before pagination (a lower bound when the collect ceiling was hit).
        truncated:
          type: boolean
          description: True when matches exist beyond the offset+head_limit window (or the collect ceiling was hit).
        applied_limit: {type: integer, description: Effective page size.}
        applied_offset: {type: integer, description: Effective window offset.}
        entries:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSearchEntry'
    UploadResponse:
      type: object
      required: [path, size]
      properties:
        path: {type: string, description: Workspace-relative path of the stored file.}
        size: {type: integer, format: int64}
    FileContentResponse:
      type: object
      required: [path, content, size]
      properties:
        path: {type: string}
        content: {type: string}
        size: {type: integer}
    WriteContentRequest:
      type: object
      required: [content]
      description: Body for PUT .../files/{path}/content.
      properties:
        content:
          type: string
          description: Full text body to write as a whole-file replace (create-or-replace, like xizhi_write_file).
    FileContentWriteResponse:
      type: object
      required: [path, size]
      description: Response for PUT .../files/{path}/content.
      properties:
        path: {type: string, description: Workspace-relative path of the written file.}
        size: {type: integer, description: Number of bytes written.}
    UpdateTitleRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          description: New session title (max 20 characters; longer values are truncated).
    UpdateTitleResponse:
      type: object
      required: [session_id, title, update_time]
      properties:
        session_id: {type: string}
        title: {type: string}
        update_time:
          type: string
          format: date-time
    RenameRequest:
      type: object
      required: [new_path]
      properties:
        new_path:
          type: string
          minLength: 1
          description: Workspace-relative destination path.
        overwrite:
          type: boolean
          default: false
          description: |
            When true and the final destination is an existing file, atomically
            replace it. Default false preserves the 409-on-existing-file behavior.
            Overwriting an existing directory is rejected with 409 DEST_NOT_EMPTY;
            tree merge is not supported.
    RenameResponse:
      type: object
      required: [old_path, new_path]
      properties:
        old_path: {type: string}
        new_path: {type: string}
    CreateNodeRequest:
      type: object
      required: [type]
      description: |
        Body for POST .../files/{path}. The target path comes from the URL
        catch-all (like Rename); the body selects whether to create a file or a
        directory. The created node is empty — content writes use PUT .../content.
      properties:
        type:
          type: string
          enum: [file, directory]
          description: "Kind of node to create. Strict create: an existing leaf of either kind returns 409 ALREADY_EXISTS."
    CreateNodeResponse:
      type: object
      required: [path, type]
      description: Response for POST .../files/{path}.
      properties:
        path: {type: string, description: Workspace-relative path of the created node.}
        type:
          type: string
          enum: [file, directory]
          description: Kind of node created (echoes the request type).
    MCPTool:
      type: object
      required: [type, name, description, parameters, server]
      properties:
        type:
          type: string
          enum: [function]
          example: function
        name: {type: string}
        description: {type: string}
        parameters:
          type: object
          additionalProperties: true
          description: JSON Schema describing the tool's input parameters.
        server:
          type: string
          description: The MCP source this tool belongs to — an operator (global) MCP server name or a per-user MCP server name.
    MCPToolsResponse:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/MCPTool'
    SkillEntry:
      type: object
      required: [name, filename, size, update_time]
      properties:
        name:
          type: string
          description: Skill identifier (the subdirectory name containing SKILL.md).
        filename:
          type: string
          description: Same as `name`; the skill directory name.
        size: {type: integer, format: int64}
        update_time:
          type: string
          format: date-time
        location:
          type: string
          description: |
            Present ONLY on skill-market entries (skill-market capability):
            `"skill_market"`. Local (user-directory) entries omit the field and
            serialize exactly as before the capability. A name conflict
            between a local skill and a market skill resolves local-first.
        description:
          type: string
          description: Present ONLY on skill-market entries — the description
            from the market API (the disk SKILL.md is not consulted).
    SkillsResponse:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillEntry'
    ModelsResponse:
      type: object
      required: [models, default, default_reasoning_effort]
      description: |
        The selectable model catalog (per-request-model-selection). `thinking`
        tells clients whether `reasoning_effort` values other than `none` are
        valid for the model (and which wire family the model uses).
        `default_reasoning_effort` is the deployment-level default thinking
        effort (`openai.default_reasoning_effort`, `"none"` when unset) — the
        natural preselection for an effort picker. Each turn's resolved model
        is recorded in run meta (`GET .../turns/{run_id}/events` payloads) and
        the `turn_usage` table's `model` column (NULL on pre-migration rows)
        for per-model cost aggregation.
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelEntry'
        default:
          type: string
          description: The default model name (openai.default_model, else the first catalog entry).
        default_reasoning_effort:
          type: string
          enum: [none, low, medium, high, xhigh, max]
          description: The deployment default reasoning effort applied to requests that omit `reasoning_effort`.
    ModelEntry:
      type: object
      required: [name, max_context_tokens, max_completion_tokens, thinking]
      properties:
        name:
          type: string
          description: Model name — the value a request's `model` parameter accepts.
        max_context_tokens:
          type: integer
          description: The model's context window; the context-compaction threshold for turns selecting it (0.8 × this value).
        max_completion_tokens:
          type: integer
          description: |
            The model's output-token quota, shared by every agent of a turn
            that resolves to this entry (per-model-completion-budget). The wire
            family translates it: a `thinking: true` model sends it as
            `max_completion_tokens`, a `thinking: false` model as the legacy
            `max_tokens` parameter. The per-entry `length_continue`
            continuation switch is operator-only and not exposed here.
        thinking:
          type: boolean
          description: Whether the model supports reasoning (gates non-`none` reasoning_effort values).
    LLMTokenStatus:
      type: object
      required: [configured]
      description: |
        Per-user LLM gateway token status (user-llm-token). The raw token is
        never serialized; `masked_key` is a fixed mask plus the last four
        characters (omitted entirely when no token is configured, and reduced
        to just the mask for tokens of eight characters or fewer so the
        preview can never reconstruct the secret).
      properties:
        configured:
          type: boolean
          description: Whether the user has a personal gateway token stored.
        masked_key:
          type: string
          description: Unrecoverable preview (`***` + last four characters); present only when configured.
    LLMTokenPutRequest:
      type: object
      required: [api_key]
      description: |
        Body for PUT /api/v1/me/llm-token. The token is trimmed server-side
        and must be non-empty with at most 512 characters.
      properties:
        api_key:
          type: string
          maxLength: 512
          description: The user's gateway token (plaintext in the request body; stored plaintext in MySQL, never returned).
    OnlyOfficeConfigResponse:
      type: object
      required: [server_url, edit, view]
      description: |
        Server-signed OnlyOffice DocEditor configs for both edit and view modes.
        The browser loads api.js from `server_url` and instantiates
        `new DocsAPI.DocEditor(id, {...config, token})` for whichever mode it
        needs. The OnlyOffice secret never leaves the server — each `token` is
        an HS256 JWT whose payload is that mode's `config`, verifiable by the
        DocumentServer with the same secret. Because the token signs the whole
        config, the frontend cannot switch modes by mutating a config in place;
        it must use the pre-signed edit or view token. Both modes share one
        freshly random `document.key` (per request).
      properties:
        server_url:
          type: string
          description: Browser-facing DocumentServer origin (api.js is loaded from here).
        edit:
          $ref: '#/components/schemas/OnlyOfficeModeConfig'
        view:
          $ref: '#/components/schemas/OnlyOfficeModeConfig'
    OnlyOfficeModeConfig:
      type: object
      required: [config, token]
      description: |
        One signed DocEditor config (edit or view). `config` is the editor
        config object; `token` is the HS256 JWT signing exactly that `config`
        with the OnlyOffice secret. The edit and view tokens are distinct.
      properties:
        config:
          type: object
          description: |
            DocEditor config object. `edit.config` carries `documentType`
            (word/cell/slide), `document{fileType, key, title, url,
            permissions{edit:true, download:true}}` and `editorConfig{mode:"edit",
            callbackUrl, customization{forcesave:true}, user}`. `view.config` is
            identical except `document.permissions.edit` is `false` and
            `editorConfig{mode:"view", callbackUrl, user}` carries no
            `customization.forcesave`. Both share the same `document.key`
            (freshly random per request); `document.url` and
            `editorConfig.callbackUrl` are rooted at the backend's internal origin
            and carry the user JWT as a query `token`.
          additionalProperties: true
        token:
          type: string
          description: HS256 JWT signing this mode's `config` with the OnlyOffice secret; edit and view tokens differ.
    OnlyOfficeVersionConfigResponse:
      type: object
      required: [server_url, view]
      description: |
        Server-signed OnlyOffice DocEditor config for viewing a specific
        historical version (view-only). Mirrors one mode of
        OnlyOfficeConfigResponse — a single `{config, token}` pair nested under
        `view` — so the frontend reuses its existing `view` consumption path. A
        historical version is immutable, so only the view mode is returned (no
        edit). `document.url` points at the external office-vers service
        (`{version_service_url}/documents/{userUUID}/{path}?action=version&versionId=<vid>`)
        and carries NO credential (office-vers is unauthenticated by design);
        `document.key` is derived deterministically from `(path, versionId)`
        (`base32(sha256(path + ":" + versionId))`) so OnlyOffice caches and shares
        the conversion across opens/users; the config carries no `callbackUrl`
        and no `customization.forcesave` (nothing to save back to an immutable
        version).
      properties:
        server_url:
          type: string
          description: Browser-facing DocumentServer origin (api.js is loaded from here).
        view:
          $ref: '#/components/schemas/OnlyOfficeModeConfig'
    OnlyOfficeCallbackRequest:
      type: object
      description: |
        OnlyOffice DocumentServer save callback. `status` 2/6 carry the edited
        document at `url` and trigger a download + workspace overwrite; other
        statuses (1/3/4/7) are acknowledged without writing.
      properties:
        status:
          type: integer
          description: Document state (1=being edited, 2=ready for saving, 3/7=saving error, 4=closed no changes, 6=forcesave).
        key:
          type: string
          description: Document key the config was signed with.
        url:
          type: string
          description: URL of the edited document to download (only present on save statuses).
    OnlyOfficeCallbackResponse:
      type: object
      required: [error]
      description: |
        OnlyOffice callback contract. `error` 0 = success; non-0 makes the
        DocumentServer retry. Auth/path errors are reported as normal HTTP 4xx,
        not through this body.
      properties:
        error: {type: integer, description: "0 on success, non-0 to trigger a DocumentServer retry."}
  responses:
    BadRequest:
      description: Malformed request body or missing field.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Operation not permitted (e.g. path outside workspace).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AlreadyExists:
      description: Target resource already exists.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: Uploaded file exceeds the size limit.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Internal:
      description: Unexpected server error.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
security:
  - BearerAuth: []
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check endpoint.
      security: []
      responses:
        '200':
          description: Server is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange a username for a JWT access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {username: alice}
      responses:
        '200':
          description: Successful login.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            Authentication failed. The `message` distinguishes the cause:
            `user not found` or `user disabled`. Unexpected internal failures
            collapse to a generic `unauthorized`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                userNotFound:    {value: {error: {code: UNAUTHORIZED, message: "user not found"}}}
                userDisabled:    {value: {error: {code: UNAUTHORIZED, message: "user disabled"}}}
                unauthorized:    {value: {error: {code: UNAUTHORIZED, message: "unauthorized"}}}
  /api/v1/sessions:
    get:
      tags: [Session]
      summary: List the authenticated user's sessions, newest first.
      responses:
        '200':
          description: Session list (empty array when none exist).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionListResponse'}
              examples:
                populated:
                  value:
                    sessions:
                      # A session with a turn still running (turn-detach-resume):
                      # generating=true carries the active run_id — the
                      # attach/cancel target and the reload recovery path.
                      - session_id: sess_1
                        title: "Plan release"
                        update_time: "2026-06-11T10:00:00Z"
                        generating: true
                        run_id: "018f9b8a-7c1a-7e6a-8e6a-6c1a7c1a7c1a"
                      # An idle session: generating=false, run_id omitted.
                      - session_id: sess_2
                        title: "Notes"
                        update_time: "2026-06-10T09:00:00Z"
                        generating: false
                empty: {value: {sessions: []}}
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [Session]
      summary: Create a new session.
      description: |
        The server mints a UUID v7 session_id, persists the session row, and
        returns it. Clients must create a session before sending messages.
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateSessionResponse'}
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/sessions/{session_id}:
    get:
      tags: [Session]
      summary: Read a single session owned by the authenticated user.
      description: |
        Returns the session detail — the session-list entry superset plus
        create_time. A session that does not exist or belongs to another user
        returns 404 (existence is never disclosed). An active-run claim read
        failure degrades to generating=false; a title lookup failure degrades
        to an empty title.
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
          description: ID of the session to read.
      responses:
        '200':
          description: Session detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionDetail'}
              examples:
                generating:
                  value:
                    session_id: sess_1
                    title: "Plan release"
                    create_time: "2026-06-10T09:00:00Z"
                    update_time: "2026-06-11T10:00:00Z"
                    generating: true
                    run_id: "018f9b8a-7c1a-7e6a-8e6a-6c1a7c1a7c1a"
                idle:
                  value:
                    session_id: sess_2
                    title: "Notes"
                    create_time: "2026-06-10T09:00:00Z"
                    update_time: "2026-06-10T09:00:00Z"
                    generating: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Session]
      summary: Delete a session owned by the authenticated user.
      description: |
        Archives the session and all of its titles/messages verbatim into the
        `*_deleted` mirror tables, purges the live rows (archive + purge is a
        single atomic transaction), and removes the warm-tier session file.
        Redis cache entries (`session:{id}`, `msgs:{id}`) are intentionally not
        cleared; every read path re-validates ownership against MySQL first, so
        stale cache keys are unreachable until they expire on TTL. Deleting a
        session that does not exist or belongs to another user returns 404; the
        existence of another user's session is never disclosed.
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
          description: ID of the session to delete.
      responses:
        '204':
          description: Session deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [Session]
      summary: Update the title of a session owned by the authenticated user.
      description: |
        Sets a manual title for the session. Manual titles are not overwritten
        by asynchronous AI title generation and the session's update_time is
        refreshed so the session appears first in the list.
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
          description: ID of the session to update.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTitleRequest'}
      responses:
        '200':
          description: Title updated successfully.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpdateTitleResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/sessions/{session_id}/subagents/{agent_instance_id}/runs:
    get:
      tags: [Session]
      summary: List terminal sub-agent runs.
      description: |
        Returns lightweight metadata for every durably persisted run of one
        sub-agent instance. The session must belong to the authenticated user;
        missing sessions, cross-user sessions, and missing instances all return
        404 without distinguishing the cause. Message payloads are intentionally
        omitted — fetch a run detail lazily when the user expands it.
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
        - name: agent_instance_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Run metadata ordered by `run_no` ascending.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubAgentRunListResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/sessions/{session_id}/subagents/{agent_instance_id}/runs/{run_id}:
    get:
      tags: [Session]
      summary: Lazily load one sub-agent run transcript.
      description: |
        Returns a sanitized transcript for one terminal run. The response is a
        stable frontend DTO, not the internal OpenAI chat snapshot: system
        prompts, tool definitions, resume metadata, context counters, and raw
        `messages_json` are never exposed. A run still executing has no durable
        terminal row and returns 404; use the live SSE/run event endpoint for
        in-flight output.
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
        - name: agent_instance_id
          in: path
          required: true
          schema: {type: string}
        - name: run_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Sanitized per-run transcript.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubAgentRunDetail'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/sessions/{session_id}/messages:
    get:
      tags: [Session]
      summary: List the messages of a session with cursor pagination.
      description: |
        Returns the full event stream of a session owned by the authenticated
        user. Messages are ordered by `(msg_time, msg_index)` ascending by
        default; use `order=desc` to retrieve newest first. Pass
        `page_token` from the previous response to advance pages.
        While a turn is running, history is incremental: the user row and
        already-closed merged events can appear before `done`. A still-growing
        token/reasoning span is not written until it closes. Clients that
        combine history with live run replay should deduplicate rows by
        `trace_id` and `msg_index` (equivalently, the deterministic
        `client_msg_id` when present); the event stream remains authoritative
        for live output.
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
        - name: page_token
          in: query
          required: false
          schema: {type: string}
          description: Opaque cursor from the previous page's `next_page_token`.
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 5000
          description: Number of messages per page. Values above 200 are clamped.
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sort order for `(msg_time, msg_index)`.
      responses:
        '200':
          description: Paginated message list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionMessagesResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [Session]
      summary: Send a user message and stream the agent's response as SSE.
      description: |
        The session must already exist and belong to the authenticated user.
        Sending to a non-existent session or another user's session returns 404.
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendMessageRequest'}
      responses:
        '200':
          description: |
            Server-Sent Events stream. Each event frame is `id: <cursor>`,
            `event: <type>`, and `data: <json>` followed by a blank line
            (turn-detach-resume: the `id` line carries the run event log's
            stream entry id; native EventSource clients replay it as
            `Last-Event-ID` when resuming via
            `GET /api/v1/sessions/{session_id}/turns/{run_id}/events`).
            The response carries an `X-Run-Id` header (the run id, equal to
            the request's trace id); every event's `meta.run_id` carries the
            same value. Disconnecting from this stream does NOT cancel the
            turn — cancel explicitly via the cancel endpoint.
            Stream closure waits for terminal message persistence with bounded
            retry and a bounded MySQL drain attempt. On a healthy storage path,
            stream completion therefore implies that the complete turn is
            available from the message-history endpoint.
            Event types: `agent_start`, `token`, `reasoning`, `tool_call`, `tool_result`, `plan_updated`,
            `agent_end`, `agent_error`, `done`. The `done` event is always the final event.
          headers:
            X-Run-Id:
              description: The run id of this turn (equals the request's trace id) — the cancel/resume target.
              schema: {type: string}
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SSEAgentStart'
                  - $ref: '#/components/schemas/SSEToken'
                  - $ref: '#/components/schemas/SSEReasoning'
                  - $ref: '#/components/schemas/SSEToolCall'
                  - $ref: '#/components/schemas/SSEToolResult'
                  - $ref: '#/components/schemas/SSEPlanUpdated'
                  - $ref: '#/components/schemas/SSEAgentEnd'
                  - $ref: '#/components/schemas/SSEAgentError'
                  - $ref: '#/components/schemas/SSEDone'
        '400':
          description: |
            Malformed body, a rejected per-request model selection
            (per-request-model-selection): `INVALID_MODEL` (unknown catalog
            name) or `INVALID_EFFORT` (invalid effort value, non-`none`
            effort explicitly requested on a `thinking: false` entry, or an
            effort conflicting with a configured agent `output_schema`), or
            `CONTENT_TOO_LONG` (add-input-token-limit): the `content`'s
            estimated token count exceeds `messages.max_input_tokens`
            (default 5000; CJK-aware heuristic estimate, message carries the
            limit and the estimate). Rejected before any storage I/O, the
            session-run claim, or an LLM call.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: |
            `REQUEST_TOO_LARGE` (add-input-token-limit): the request body
            exceeds the 1MB backstop cap and is rejected during parsing,
            before any storage I/O. Independent of
            `messages.max_input_tokens` (an explicit 0 disables the token
            check, never this cap).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: |
            The session already has a running turn (single active run per
            session). The error object carries the active `run_id` so the
            client can attach to the running turn instead of retrying.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message, run_id]
                    properties:
                      code:
                        type: string
                        enum: [SESSION_BUSY]
                      message:
                        type: string
                      run_id:
                        type: string
                        description: The currently running turn's run id (attach target).
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/sessions/{session_id}/turns/{run_id}/cancel:
    post:
      tags: [Session]
      summary: Cancel a running turn by run id (turn-detach-resume).
      description: |
        Cancels the turn identified by `run_id` and releases its resources.
        Three outcomes: the run is in THIS agent process (cancelled
        immediately, partial output persists through the interrupted-turn
        path), the run heartbeats on another replica (a Redis cancel flag is
        raised; the owning process cancels within one heartbeat period), or
        the run is dead (crashed process — force-cleared to `interrupted`,
        session unlocked). Cancelling an already-terminal run is idempotent
        and reports the terminal status. The run must belong to the caller
        and the path session, otherwise 404.
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
        - name: run_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Cancellation accepted (or already terminal).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TurnStatusResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/sessions/{session_id}/turns/{run_id}/events:
    get:
      tags: [Session]
      summary: Resume a run's event stream over SSE (turn-detach-resume).
      description: |
        Replays the run's event log from the beginning (or strictly after the
        `Last-Event-ID` request header) and then tails live output until the
        run reaches a terminal state — the endpoint a client uses when
        reopening a session whose previous request is still generating.
        Multiple concurrent subscribers (multiple tabs) are independent. A
        terminal-but-still-retained run replays fully and closes; a run whose
        retention window passed (or never existed) returns 410 — fall back to
        the ordinary message-history read. If a status-running run's process
        died, the stream replays what was logged, then emits a synthesized
        terminal `done` event carrying `usage.error = "interrupted..."`.
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
        - name: run_id
          in: path
          required: true
          schema: {type: string}
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: string}
          description: Stream entry id from a prior subscription's last received frame; resume strictly after it.
      responses:
        '200':
          description: |
            Server-Sent Events stream of the run's events (same frame format
            as POST /messages, including `id:` lines and `X-Run-Id` header).
            The stream ends after the terminal `done` event.
          headers:
            X-Run-Id:
              description: The run id being replayed/tailed.
              schema: {type: string}
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SSEAgentStart'
                  - $ref: '#/components/schemas/SSEToken'
                  - $ref: '#/components/schemas/SSEPlanUpdated'
                  - $ref: '#/components/schemas/SSEAgentError'
                  - $ref: '#/components/schemas/SSEDone'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The run is no longer replayable (retention window passed or unknown); read the ordinary message history instead.
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/workspace/files:
    get:
      tags: [Workspace]
      summary: List files in (a subdirectory of) the user's workspace.
      parameters:
        - name: path
          in: query
          required: false
          schema: {type: string}
          description: Optional workspace-relative subdirectory. Defaults to the workspace root.
        - name: include_hidden
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Whether to include hidden files and directories (names starting with '.'). Defaults to false.
      responses:
        '200':
          description: File/dir entries, sorted (directories first, then name).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileListResponse'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/workspace/files/download/{path}:
    get:
      tags: [Workspace]
      summary: Download a workspace file using a URL token.
      description: |
        Authenticates via the `token` query parameter instead of the
        `Authorization` header. Designed for browser-native elements such as
        `<a download>`, `<img src>`, and PDF.js that cannot set custom headers.
        Returns `Content-Disposition: attachment` by default; pass `inline=1`
        for preview contexts. The response also carries
        `Cache-Control: private, no-store` and `Referrer-Policy: no-referrer`
        to mitigate the risk of the JWT leaking through caches or Referer headers.
      security: []
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          description: Workspace-relative file path (catch-all, may include `/`).
          example: reports/2026-q2.md
        - name: token
          in: query
          required: true
          schema: {type: string}
          description: JWT access token issued by POST /api/v1/auth/login.
        - name: inline
          in: query
          required: false
          schema:
            type: integer
            enum: [1]
          description: "Set to 1 to return Content-Disposition: inline for previews."
      responses:
        '200':
          description: File bytes; content-type reflects the file extension.
          headers:
            Content-Disposition:
              description: attachment or inline, with ASCII and RFC 5987 filename values.
              schema: {type: string}
            Cache-Control:
              schema: {type: string, example: "private, no-store"}
            Referrer-Policy:
              schema: {type: string, example: "no-referrer"}
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Missing/empty `path`, or `path` resolves to a directory.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                missingPath: {value: {error: {code: BAD_REQUEST, message: "path is required"}}}
                directory:   {value: {error: {code: BAD_REQUEST, message: "path is a directory"}}}
        '401':
          description: Missing, invalid, or expired query token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                missingToken:  {value: {error: {code: UNAUTHORIZED, message: "missing token"}}}
                invalidToken:  {value: {error: {code: UNAUTHORIZED, message: "invalid token"}}}
                expiredToken:  {value: {error: {code: UNAUTHORIZED, message: "token expired"}}}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/workspace/search:
    get:
      tags: [Workspace]
      summary: Search workspace entries by name.
      description: |
        Recursively searches the user's workspace for files and directories
        whose NAME (basename, never the path) contains the pattern as a
        literal substring — regex metacharacters are escaped server-side, so
        `report(1).md` and `a+b` match their literal spellings. Reuses the
        agent-side xizhi_find engine (fd / pure-Go dual backend), so matching
        semantics match the agent tool: hidden entries excluded by default, no
        symlink following, ignore files (.gitignore) not consulted. Unlike the
        agent tool, `ignore_case` defaults to `true` (human-search convention)
        and the reserved `.blowball/` namespace is searchable — both as a
        search root and (with `include_hidden=true`) as content.

        Entries are returned in lexicographic path order (the stable
        pagination backbone; no relevance ranking). `size`/`update_time` are
        stat'd only for the returned page; an entry deleted between the walk
        and the stat stays in the page with `size: 0` and `update_time: ""`.
        The whole search (walk + stat) is bounded by a server-side timeout
        (~10s) — a timeout returns 500 SEARCH_TIMEOUT rather than hanging.
      parameters:
        - name: pattern
          in: query
          required: false
          schema: {type: string}
          description: |
            Substring matched against entry names. Empty/blank matches
            everything (combine with `type` for type-only enumeration). The
            response echoes this raw value.
          example: report(1)
        - name: type
          in: query
          required: false
          schema: {type: string, enum: [file, dir, any], default: any}
          description: Restrict results to files, directories, or both.
        - name: path
          in: query
          required: false
          schema: {type: string}
          description: |
            Workspace-relative search root (empty/blank = the workspace
            root). A non-existent root returns 200 with empty entries; a
            regular-file root returns 400. `.blowball/` subpaths are allowed
            (unlike the agent's xizhi_find).
        - name: max_depth
          in: query
          required: false
          schema: {type: integer, minimum: 0}
          description: Maximum component count below the search root (default unlimited).
        - name: ignore_case
          in: query
          required: false
          schema: {type: boolean, default: true}
          description: Case-insensitive matching. Defaults to TRUE on this endpoint.
        - name: include_hidden
          in: query
          required: false
          schema: {type: boolean, default: false}
          description: Include entries whose names start with '.' (and hidden subtrees).
        - name: head_limit
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 200}
          description: Page size; `applied_limit` echoes the effective value.
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
          description: Page offset into the lexicographically sorted matches.
      responses:
        '200':
          description: |
            A page of matches. `total` counts all matches (a lower bound when
            the internal ~10000-entry collect ceiling was hit); `truncated` is
            true when more matches exist beyond the window.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceSearchResponse'}
        '400':
          description: |
            Invalid `type`/`max_depth`/`head_limit`/`offset`, or the search
            root is a regular file.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                invalidType: {value: {error: {code: INVALID_REQUEST, message: "type must be \"file\", \"dir\" or \"any\""}}}
                fileRoot:    {value: {error: {code: INVALID_PATH, message: "search root must be a directory"}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Search timed out or an unexpected internal error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                timeout:  {value: {error: {code: SEARCH_TIMEOUT, message: "search timed out; try narrowing the search root or pattern"}}}
                internal: {value: {error: {code: INTERNAL, message: "search failed"}}}
  /api/v1/workspace/upload:
    post:
      tags: [Workspace]
      summary: Upload a file into the user's workspace.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                path:
                  type: string
                  description: Destination subdirectory (empty/absent means root).
      responses:
        '200':
          description: Upload succeeded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Uploaded file exceeds the 50 MiB size limit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                fileTooLarge: {value: {error: {code: FILE_TOO_LARGE, message: "file too large"}}}
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/workspace/files/{path}:
    get:
      tags: [Workspace]
      summary: Download a workspace file as raw bytes.
      description: |
        The `path` parameter is a workspace-relative path (which may contain
        slashes). `path` ending in `/content` selects the text-content
        endpoint instead. The content-type of the response reflects the
        file's extension.
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          description: Workspace-relative file path (catch-all, may include `/`).
          example: reports/2026-q2.md
      responses:
        '200':
          description: File bytes; content-type varies by extension.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Path resolves to a directory.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Workspace]
      summary: Delete a workspace file or directory.
      description: |
        Removes a file or, when the path targets a directory, recursively
        removes the directory and everything beneath it. The path is validated
        with the same traversal / symlink-escape check as the read endpoints,
        so anything resolving outside the workspace is rejected with 403.
        Workspace files have no database source table, so nothing is archived —
        the entry is removed from the filesystem only.
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          description: Workspace-relative file or directory path (catch-all, may include `/`).
          example: reports/old
      responses:
        '204':
          description: File or directory deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [Workspace]
      summary: Rename or move a workspace file or directory.
      description: |
        Renames or moves a file or directory within the user's workspace. When
        new_path resolves to an existing directory, the source is moved inside it
        as new_path/<basename> (the "drag into a folder" gesture). Otherwise the
        final destination must not already exist: if it does, the operation
        returns 409 unless `overwrite` is true, in which case an existing file
        destination is atomically replaced (overwriting a directory is rejected
        with 409 DEST_NOT_EMPTY; tree merge is not supported). No changes are
        made on any rejection.
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          description: Workspace-relative source file or directory path (catch-all, may include `/`).
          example: reports/old.md
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameRequest'}
      responses:
        '200':
          description: Rename succeeded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RenameResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Final destination already exists, or (with overwrite) is an existing
            directory.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                alreadyExists: {value: {error: {code: ALREADY_EXISTS, message: "destination already exists"}}}
                destNotEmpty:  {value: {error: {code: DEST_NOT_EMPTY, message: "destination directory is not empty; merge not supported"}}}
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [Workspace]
      summary: Create an empty workspace file or directory.
      description: |
        Strict create of an empty file or directory selected by the body
        {"type": "file" | "directory"}. The path comes from the URL catch-all
        (like Rename, whose params live in the body). "Strict" means a target leaf
        that already exists — file OR directory — is rejected with 409
        ALREADY_EXISTS and left untouched; there is no check-then-create window,
        because file creation uses OpenFile(O_CREATE|O_EXCL) and directory
        creation uses os.Mkdir, both of which surface EEXIST on an existing leaf
        (so two concurrent creates of the same path resolve as one 200 and one
        409). Missing parent directories are auto-created (MkdirAll on the
        parent), so a nested path (e.g. a/b/c) is established in one call; the
        strict guarantee applies only to the leaf itself. This is distinct from
        PUT .../content, which is a create-or-replace for text content — POST
        creates empty nodes only. POST has no /content split, so it registers
        directly on the catch-all with no suffix dispatcher.
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          description: Workspace-relative path of the node to create (catch-all, may include `/`).
          example: notes/hello.md
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateNodeRequest'}
            examples:
              file:      {value: {type: file}}
              directory: {value: {type: directory}}
      responses:
        '200':
          description: Node created; its relative path and kind.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateNodeResponse'}
              examples:
                file:      {value: {path: notes/hello.md, type: file}}
                directory: {value: {path: notes/hello.md, type: directory}}
        '400':
          description: |
            Creating the workspace root (empty path), or a missing/invalid `type`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                badType:  {value: {error: {code: BAD_REQUEST, message: "type must be \"file\" or \"directory\""}}}
                rootPath: {value: {error: {code: BAD_REQUEST, message: "path is required"}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A file or directory already exists at the target leaf.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                alreadyExists: {value: {error: {code: ALREADY_EXISTS, message: "node already exists"}}}
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/workspace/files/{path}/content:
    get:
      tags: [Workspace]
      summary: Fetch a workspace file's text content as JSON.
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          description: Workspace-relative file path (catch-all, may include `/`).
      responses:
        '200':
          description: Decoded text content of the file.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileContentResponse'}
        '400':
          description: File is binary or path is a directory. Use the download endpoint for binary files.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                binaryFile: {value: {error: {code: BINARY_FILE, message: "binary file, use download endpoint"}}}
                directory:  {value: {error: {code: BAD_REQUEST, message: "path is a directory"}}}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [Workspace]
      summary: Create or replace a workspace file's text content atomically.
      description: |
        Symmetric write counterpart to GET .../content: an atomic, create-or-replace
        (HTTP PUT) text-content write. A missing target file is created (missing
        parents are auto-created); an existing file is fully replaced via a
        temp-file + rename, so a crash mid-write never truncates the destination.
        The body is capped at the server's max upload size, and only text is
        accepted — a NUL byte is rejected with 400 BINARY_FILE (binary/large files
        use POST .../upload). The `path` is the catch-all workspace-relative file
        path; a trailing `/content` selects this operation under the PUT catch-all.
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          description: Workspace-relative file path (catch-all, may include `/`).
          example: notes/hello.md
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WriteContentRequest'}
            example: {content: "# Hello"}
      responses:
        '200':
          description: Content written; the file's relative path and byte size.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileContentWriteResponse'}
        '400':
          description: Malformed body, the target is an existing directory, or the content is binary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                binaryFile: {value: {error: {code: BINARY_FILE, message: "binary content, use upload endpoint"}}}
                directory:  {value: {error: {code: BAD_REQUEST, message: "path is a directory"}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/workspace/files/{path}/onlyoffice-config:
    get:
      tags: [Workspace]
      summary: Build and sign OnlyOffice edit + view configs for a workspace office file.
      description: |
        Returns server-signed DocEditor configs (`{server_url, edit, view}`, each
        mode an `{config, token}` pair) so the browser can open the file in either
        edit or view mode in OnlyOffice without a second round-trip. The OnlyOffice
        secret lives only in the backend config and never reaches the browser; each
        `token` is an HS256 JWT whose payload is that mode's `config`. `document.url`
        and `editorConfig.callbackUrl` point at the backend's internal origin and
        embed the caller's JWT as a query `token`; both modes share one freshly
        random `document.key` so reopening always re-converts. Shares the workspace
        catch-all with `/content`, dispatching on the trailing `/onlyoffice-config`
        suffix.
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          description: Workspace-relative office file path (catch-all, may include `/`).
          example: reports/2026-q2.docx
      responses:
        '200':
          description: Signed editor config.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OnlyOfficeConfigResponse'}
        '400':
          description: The path resolves to a directory.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                directory: {value: {error: {code: BAD_REQUEST, message: "path is a directory"}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: OnlyOffice is not configured (secret empty); editing is disabled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                disabled: {value: {error: {code: ONLYOFFICE_DISABLED, message: "onlyoffice is not configured"}}}
  /api/v1/workspace/files/{path}/onlyoffice-version-config:
    get:
      tags: [Workspace]
      summary: Build and sign an OnlyOffice view-only config for a historical version.
      description: |
        Returns a server-signed view-only DocEditor config
        (`{server_url, view:{config, token}}`) so the browser can preview a
        specific historical version of a workspace office file in OnlyOffice.
        The caller supplies the `versionId` (obtained elsewhere from the
        office-vers service); `document.url` points at office-vers for that
        version and carries no credential. The OnlyOffice secret lives only in
        the backend; `view.token` is an HS256 JWT whose payload is the
        `view.config`. Unlike the live-file `/onlyoffice-config` endpoint:
        `document.url` targets office-vers (not the backend), `document.key` is
        deterministic per `(path, versionId)` (so conversions are cached/shared),
        the config is view-only with no `callbackUrl`/`forcesave`, and the local
        workspace file is NOT stat-checked (the version's source of truth is
        office-vers). Shares the workspace catch-all, dispatching on the
        trailing `/onlyoffice-version-config` suffix.
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          description: Workspace-relative office file path (catch-all, may include `/`).
          example: reports/2026-q2.docx
        - name: versionId
          in: query
          required: true
          description: |
            The office-vers (MinIO) version id of the historical version to
            preview. Obtained from the office-vers version-history listing.
          schema: {type: string}
          example: 7a604dc7-719f-426f-88c4-642313fd2860
      responses:
        '200':
          description: Signed view-only editor config for the requested version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OnlyOfficeVersionConfigResponse'}
        '400':
          description: The `versionId` query parameter is missing.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                missing_version: {value: {error: {code: BAD_REQUEST, message: "versionId is required"}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: OnlyOffice is not configured (`secret` or `version_service_url` empty).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                disabled: {value: {error: {code: ONLYOFFICE_DISABLED, message: "onlyoffice is not configured"}}}
  /api/v1/workspace/onlyoffice-callback:
    post:
      tags: [Workspace]
      summary: Receive an OnlyOffice document-save callback and persist it.
      description: |
        Endpoint the OnlyOffice DocumentServer POSTs to when a document is saved.
        Authenticates via the `token` query parameter (the user JWT embedded in
        the signed `callbackUrl`) instead of the Authorization header, since the
        callback originates from the DocumentServer container. For save statuses
        (2/6) it downloads the edited file from `url` — host-allowlisted to the
        configured DocumentServer to mitigate SSRF — and atomically overwrites the
        workspace file (capped at the upload size limit). Non-save statuses are
        acknowledged without writing. Outcomes use OnlyOffice's `{"error": N}`
        convention (0 = ok, non-0 = retry); auth/path errors are normal HTTP 4xx.
      security: []
      parameters:
        - name: path
          in: query
          required: true
          schema: {type: string}
          description: Workspace-relative file path to overwrite.
          example: reports/2026-q2.docx
        - name: token
          in: query
          required: true
          schema: {type: string}
          description: JWT access token (embedded in the signed callbackUrl).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OnlyOfficeCallbackRequest'}
            examples:
              save: {value: {status: 2, key: "abc123", url: "http://documentserver/cache/abc.docx"}}
              forcesave: {value: {status: 6, key: "abc123", url: "http://documentserver/cache/abc.docx"}}
              editing: {value: {status: 1, key: "abc123"}}
      responses:
        '200':
          description: Callback processed; body reports success or a retryable error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OnlyOfficeCallbackResponse'}
              examples:
                ok: {value: {error: 0}}
                retry: {value: {error: 1}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: OnlyOffice is not configured (secret empty); editing is disabled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                disabled: {value: {error: {code: ONLYOFFICE_DISABLED, message: "onlyoffice is not configured"}}}
  /api/v1/mcp/tools:
    get:
      tags: [MCP]
      summary: List the MCP-sourced tool catalogue.
      description: |
        Returns only MCP-sourced tools. The catalogue has two parts: proxy
        tools advertised by configured operator (global) MCP servers, and the
        cached tools of the caller's per-user MCP servers (read from the
        workspace config cache; no live connections are made). Built-in tools
        (`xizhi_*`, `webfetch`, executor, `luban_*`) and synthetic `spawn_subagent`
        dispatch tool are excluded. Each entry follows the OpenAI
        function-tool shape (`type: function`) and carries a `server` field
        attributing it to its MCP source (an operator server name or a
        per-user server name). The per-user view is cache-based; freshness is
        maintained by the agent-runtime cache writers (`mcp_list_tools`,
        `mcp_add_server`, `mcp_call`). A missing/empty per-user config yields
        only the operator tools; a single malformed per-user server is
        omitted while the rest still return.
      responses:
        '200':
          description: Tool list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPToolsResponse'}
  /api/v1/skills:
    get:
      tags: [Skills]
      summary: List the authenticated user's skills.
      description: |
        When `skill_market.url` is enabled, the response merges the caller's
        market allowlist entries (additive `location: "skill_market"` +
        `description` fields; local-first on name conflicts; a market failure
        degrades to the local-only list with HTTP 200).
      responses:
        '200':
          description: Skill list (empty array when none exist).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillsResponse'}
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/models:
    get:
      tags: [Models]
      summary: List the selectable model catalog (per-request-model-selection).
      description: |
        Returns the deployment's model catalog (`openai.models`, mandatory),
        the default model name, and the deployment default reasoning effort
        (`default_reasoning_effort`) for chat-request `model`/`reasoning_effort`
        selection. Served by the api role only (the agent role does not
        register this endpoint).
      responses:
        '200':
          description: Model catalog and default.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelsResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/llm-token:
    get:
      tags: [Models]
      summary: Get the caller's LLM gateway token status (user-llm-token).
      description: |
        Reports whether the authenticated user has configured a personal LLM
        gateway token. The token itself is NEVER returned — only
        `configured` plus, when set, a `masked_key` preview (a fixed mask and
        the last four characters; tokens of eight characters or fewer show
        only the mask). Served by the api role only (the agent role does not
        register this endpoint).
      responses:
        '200':
          description: Token status (masked; never the raw token).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LLMTokenStatus'}
              examples:
                configured:
                  value: {configured: true, masked_key: '***abcd'}
                unconfigured:
                  value: {configured: false}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [Models]
      summary: Save the caller's LLM gateway token (user-llm-token).
      description: |
        Stores (and idempotently overwrites) the authenticated user's LLM
        gateway token in `user_llm_credentials`. The token replaces the
        deployment-global `openai.api_key` for every LLM call attributable to
        the user — the whole chat turn spawn tree, title generation, context
        compaction summaries, and webfetch digestion — against the SAME
        `openai.base_url` and model catalog. The value is trimmed, must be
        non-empty and at most 512 characters, and is never echoed back (only
        its mask). An invalid configured token fails the user's LLM calls
        explicitly; there is no silent fallback to the global key.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LLMTokenPutRequest'}
            example: {api_key: 'sk-my-gateway-token'}
      responses:
        '200':
          description: Token stored; the response carries only the mask.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LLMTokenStatus'}
              example: {configured: true, masked_key: '***abcd'}
        '400':
          description: Blank (after trimming) or oversize (>512 chars) token; the stored value is unchanged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Models]
      summary: Delete the caller's LLM gateway token (user-llm-token).
      description: |
        Removes the authenticated user's stored token. Subsequent LLM calls
        for the user fall back to the deployment-global `openai.api_key`.
        Deleting an absent token is a success. Served by the api role only.
      responses:
        '200':
          description: Token deleted (or already absent).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LLMTokenStatus'}
              example: {configured: false}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
