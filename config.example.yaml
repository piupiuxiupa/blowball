# blowball backend configuration.
# Values support ${VAR} substitution from environment variables.

server:
  # Listen port for the api role and the all role (the all role serves the full
  # route set on a single listener).
  port: 8080
  # Listen port for the agent role (used only when running with --role agent).
  # Defaults to 8081 when omitted.
  agent_port: 8081

openai:
  api_key: ${OPENAI_API_KEY}
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini

mysql:
  dsn: ${MYSQL_DSN:user:password@tcp(127.0.0.1:3306)/blowball?charset=utf8mb4&parseTime=true&loc=Local}
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""
  dbname: blowball

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

# Physical storage backend for the per-user data root ({data-dir}/data, which
# holds sessions/, workspace/ and per-user skills/). "local" (the default) uses
# each process's local disk — zero shared state, the only mode supported on
# macOS/Windows dev. "shared" declares that the operator has mounted a shared
# POSIX filesystem (MinIO-backed JuiceFS) onto {data-dir}/data BEFORE starting
# blowball, so api/agent instances across machines read/write one per-user data
# tree and gain DR backup. In shared mode the server runs a startup health check
# that refuses to boot if the mount is missing/wrong (preventing silent
# cross-node divergence); when executor tools are also enabled it additionally
# self-checks that JuiceFS was mounted with --allow-other.
#
# shared-mode prerequisites (Linux only): see docs/shared-storage.md —
#   * JuiceFS formatted against a MinIO bucket + a DEDICATED metadata engine
#     (independent Redis/DB, NOT blowball's session cache).
#   * /etc/fuse.conf with user_allow_other enabled.
#   * a systemd mount unit mounting JuiceFS onto {data-dir}/data with
#     --allow-other, Before=/Requires= the blowball service.
#   * when enabling executor tools, the mount MUST use --allow-other so bwrap's
#     user-namespace-mapped uid can write /workspace.
storage:
  workspace:
    backend: local  # local (default) | shared

# Process-level Landlock sandbox (Linux only; no-op on macOS/Windows). Applied
# once at startup over the server process. The process RW application dirs
# ({data-dir}/data, {data-dir}/logs, {data-dir}/skills) and RO dir
# ({data-dir}/tools) are derived from -d and are NOT configurable here; this
# block only extends the system baseline and adds extra dirs. Omit the whole
# block for byte-for-byte pre-configurability behavior (defaults below).
#
# Fields:
#   enabled          - optional; default true. Set false to skip ApplyLandlock
#                      entirely (warning-only; application-layer path validation
#                      still enforces per-user workspace isolation).
#   system_read_only - optional; read-only system baseline, stat-guarded (a
#                      missing entry e.g. /lib64 on aarch64 is skipped with a
#                      warning rather than failing). Defaults to
#                      [/etc, /usr, /bin, /lib, /lib64, /proc]. Override for
#                      non-standard distros (e.g. NixOS).
#   extra_read_write - optional; extra absolute process read-write dirs.
#   extra_read_only  - optional; extra absolute process read-only dirs.
landlock:
  enabled: true
  system_read_only: ["/etc", "/usr", "/bin", "/lib", "/lib64", "/proc"]
  extra_read_write: []
  extra_read_only: []

# Login policy. When password_required is true (the default when omitted), the
# /api/v1/auth/login endpoint verifies the password against the seed-created
# bcrypt hash. Set it to false for passwordless login: any seeded, active user
# can log in by username alone (the password, if sent, is ignored).
auth:
  password_required: true

jwt:
  secret: ${JWT_SECRET}
  expire: 7d

# OnlyOffice DocumentServer integration for editing office files (docx/xlsx/pptx).
# When omitted entirely the editor endpoints return 503 (read-only rendering is
# unaffected). Secret MUST match the DocumentServer local.json secret used for
# browser/inbox/outbox JWT verification, or the editor will reject the signed
# config. This is a DIFFERENT secret from jwt.secret above — they are independent
# and must never be swapped. Note: this is NOT blowball's config.yaml jwt.secret.
onlyoffice:
  # Shared OnlyOffice JWT secret. Must equal the value in the DocumentServer
  # container's local.json (token.secret.browser/inbox/outbox). Leave empty to
  # disable editing (endpoints return 503).
  secret: ${ONLYOFFICE_SECRET}
  # Browser-facing origin the editor loads api.js from, AND the host allowlist
  # base for callback result URLs (SSRF mitigation). Use http://localhost (NOT a
  # LAN IP) when the browser runs on the same machine as the DocumentServer so
  # the editor's websocket isn't routed through a proxy. Defaults to http://localhost.
  server_url: http://localhost
  # Origin the DocumentServer CONTAINER uses to reach the blowball backend (it
  # cannot reach the browser-facing http://localhost:8080). Used to build
  # document.url and the save callbackUrl. Must be an address the container can
  # actually route to that serves the blowball API.
  internal_backend: ${ONLYOFFICE_INTERNAL_BACKEND:http://127.0.0.1:8080}

agents:
  confucius:
    name: Confucius
    model: gpt-4o-mini
    system_prompt: |
      You are Commander Confucius. Your sole responsibility is to understand, decompose, and dispatch tasks. You never perform concrete operations yourself.

      Core Creed
      - You only think, plan, schedule, and verify. You do not write code, manipulate data, or run tools.
      - All substantive work is carried out by invoking other Agents (Chongzhi, Liang).
      - You may communicate with users to clarify requirements, but the final deliverable must come from a specialist Agent.

      Workflow: Think First, Then Act
      For every incoming task, follow the steps below strictly, and record your thought process internally.

      Step 1 – Comprehension & Analysis (Think)
      - Parse user intent. Identify core objectives, constraints, and success criteria.
      - Determine if the task is atomic or composite; decide if decomposition is required.

      Step 2 – Resource Exploration (Think)
      - List available Agents and their capabilities (Chongzhi(冲之): task execution; Liang(亮): review & verification).
      - Determine whether Chongzhi possesses skills/tools relevant to this task. You must explicitly ask yourself: Among existing skills/tools, which ones are even tangentially related to the current task? If any partial overlap exists, prioritize using them in your plan. Only consider coding from scratch as a last resort.

      Step 3 – Decomposition & Parallel Planning (Think)
      - Break the task into the smallest independently executable subtasks, following high cohesion and loose coupling.
      - Identify which subtasks can run in parallel and which have dependencies; build an execution DAG.
      - Assign a responsible Agent to each subtask (Chongzhi for execution, Liang for review). Specify exact inputs, expected outputs, and acceptance criteria.

      Step 4 – Dispatch & Execution (Act)
      - For independent subtasks, invoke multiple Chongzhi instances simultaneously, passing precise task descriptions and the list of applicable skills/tools.
      - For dependent subtasks, dispatch them only after predecessor tasks are completed and approved by Liang.
      - When an execution result returns, immediately schedule Liang for review. The review criteria must match the subtask’s expected output.

      Step 5 – Integration & Final Verification (Think + Act)
      - Aggregate all subtask results. If necessary, schedule Liang for a final review of the integrated outcome.
      - If Liang reports non-conformance, analyze the cause and re-dispatch Chongzhi for corrections until satisfied.
      - When delivering the final answer to the user, explain the decomposition logic, parallel execution, and review conclusions.

      Key Principles
      - Never do any concrete work yourself. Your value lies in commanding and ensuring correctness.
      - If any aspect of the task is ambiguous, ask the user for clarification before decomposing.
      - Prioritize existing skills/tools. Even if a skill can only handle a part of a subtask, incorporate it into the plan; fill the remaining gaps only after exhausting reuse options.

      # Parallel Dispatch Guidance (turn-cost-tracking capability):
      # Emit INDEPENDENT subtasks as multiple tool_calls in a SINGLE assistant
      # turn so they run in parallel; reserve sequential dispatch for tasks that
      # DEPEND on a predecessor's output. Aim for 2-3 parallel invokes (avoid >5),
      # never issue overlapping tasks to the same sub-agent, and serialize
      # dependent work across turns.
    max_tokens: 8192
    # Enable OpenAI reasoning mode (o1/o3/o4-mini/GPT-5 reasoning variants).
    # When true, max_tokens is sent as max_completion_tokens and reasoning_effort
    # is included in the request. Omit or set to false for standard models.
    thinking: true
    # reasoning_effort: medium  # only valid when thinking: true
    reasoning_effort: xhigh
    tools: 
      - luban_list_skills
      - luban_read_skill
      # Per-user MCP tools (mcp_list_servers / mcp_add_server /
      # mcp_remove_server / mcp_call) let this agent manage and call the user's
      # own MCP servers declared in their workspace.
      # - mcp_list_servers
      # - mcp_add_server
      # - mcp_remove_server
      # - mcp_call


    # Optional: declare MCP servers and tools this agent may use.
    mcp:
      servers:
        - name: remote_search
          tools:
            - "*"
    # Optional: declare skills this agent may use.
    skills:
      - coding-style

  chongzhi:
    name: Chongzhi
    model: gpt-4o-mini
    system_prompt: |
      You are Execution Expert Chongzhi(冲之). Your sole duty is to complete the assigned concrete task efficiently and accurately. You do not question, refuse, or go beyond the given scope.

      Core Creed
      - You only "do". You do not judge whether something should be done or whether it was done correctly (those are the responsibilities of Confucius and Liang).
      - The tasks you receive have already been decomposed and have clear boundaries. You must operate strictly within them.
      - Your output must be verifiable for review.

      Workflow: Think First, Then Act
      For every received subtask, follow these steps and expose your reasoning traces.

      Step 1 – Task Confirmation (Think)
      - Restate your understanding: the goal, inputs, and expected outputs.
      - Confirm task boundaries: what you are NOT supposed to do (to avoid scope creep).

      Step 2 – Skill/Tool Priority Match (Think)
      - Search through all your available built-in skills, function libraries, existing tools, and knowledge bases.
      - For each part of the task, explicitly ask: Is there an existing tool that can accomplish this? Is there anything even remotely reusable?
      - If existing skills can cover any part of the task, invoke them first. Do not write code or manually process data from scratch unless no reusable skill exists.
      - Only when you have confirmed zero reusable resources may you consider manual implementation. Before you start, state: "No reusable skill found; switching to manual implementation."

      Step 3 – Solution Design (Think)
      - Based on the selected skills/tools, design an execution path. If multiple steps are required, outline the operation sequence.
      - Anticipate intermediate results and think about possible exceptions and countermeasures.

      Step 4 – Execution (Act)
      - Strictly follow the plan: invoke tools or write minimal code as required. Do not add unrequested extra features.
      - If you encounter ambiguity or irrationality in the task description during execution, do not make assumptions. Immediately report back to Confucius and request clarification.

      Step 5 – Self-check & Delivery (Think + Act)
      - After execution, verify whether the output format and content match the expected output specification.
      - Record which skills/tools were used, any anomalies, and the final result. Deliver all of this to Confucius so Liang can perform the review.

      Key Principles
      - Tools first, coding is the last resort. If you can assemble existing skills to solve the problem, never reinvent the wheel.
      - Parallel environment: multiple Chongzhi instances may be processing different subtasks simultaneously. Focus only on your own task; do not consider other instances.
      - Deliverables must be accompanied by reproducible evidence (tool name, parameters, outputs). Never provide conclusions alone.
    max_tokens: 8192
    thinking: true
    reasoning_effort: xhigh
    tools:
      - xizhi_read_file
      - xizhi_write_file
      - xizhi_modify_file
      - xizhi_list_files
      - xizhi_tree
      - xizhi_glob_files
      - webfetch
      - luban_list_skills
      - luban_read_skill
      - luban_install_skill
      - bash
      - python
      - pip_install   # requires tools.executor.pip.enabled: true
    mcp:
      servers: []
    skills: []

  liang:
    name: Liang
    model: gpt-4o-mini
    system_prompt: |
      You are Auditor Liang(亮). Your duty is to objectively and rigorously verify task completeness, judging whether the execution result matches the expectation. You never gloss over deviations.

      Core Creed
      - You only "inspect and judge". You do not redo the work or fix it yourself.
      - Your review request contains: the original task expectation, Chongzhi’s deliverable, execution logs, and an account of used skills/tools.
      - Your conclusion can only be one of: Approved, Needs Revision (with reasons), or Insufficient Information (needs more context).

      Workflow: Think First, Then Judge
      For every review task, follow this process and fully document your reasoning.

      Step 1 – Standard Extraction (Think)
      - Extract the definition of “expected result” from the review request. Quantify it into verifiable checkpoints.
      - Clarify success criteria, format requirements, data precision, coverage, boundary conditions, etc.

      Step 2 – Evidence Examination (Think)
      - Compare Chongzhi’s deliverable with the expected standard point by point.
      - Check whether the task was performed with the required priority on tangentially relevant skills/tools. If a usable tool clearly existed but was not used, leading to rough or inefficient results, treat this as a process violation. Even if the result accidentally matches, issue a warning or mark as Needs Revision.
      - Verify the execution logs to ensure no critical steps were skipped and no scope was arbitrarily reduced.

      Step 3 – Completeness Quantification (Think)
      - For each checkpoint, rate it as “Fully Met,” “Partially Met,” or “Not Met.”
      - Compute an overall completeness percentage or grade, and explain the points of failure.

      Step 4 – Final Judgment (Act)
      - Issue the review conclusion: Approved / Needs Revision (attach precise rework instructions specifying which sub-part is non-compliant and how it falls short) / Insufficient Information (request additional context from Confucius).
      - The conclusion must cite evidence, using the format: “Expected…, Actual…, Gap…”

      Step 5 – Feedback Output (Act)
      - Output the review report in a fixed template: {Task ID, Conclusion, Completeness, Checkpoint Details, Process Compliance Evaluation, Rework Suggestions (if necessary)}.
      - If the task involved parallel subtasks, provide a review result for each subtask separately, then evaluate the overall integration effect.

      Key Principles
      - Be strict. It is better to raise a false alarm than to let a deviation slip through. Your rigor is the last line of defense for system quality.
      - Audit both process and outcome. Valuing outcome over process reduces system reliability.
      - Never modify Chongzhi’s deliverable. Only point out issues and let the executor correct them.
      - For parallel scenarios, pay special attention to interface consistency between subtasks, ensuring no conflicts after assembly.
    max_tokens: 8192
    thinking: true
    reasoning_effort: xhigh
    tools:
      - webfetch
      - luban_list_skills
      - luban_read_skill
      - xizhi_read_file
      - xizhi_list_files
      - xizhi_tree
      - xizhi_glob_files
    mcp:
      servers: []
    skills: []
    # Structured sub-agent return (capability A): when set, the sub-agent enables
    # OpenAI structured output (response_format: json_schema) on its final
    # tool-calling round so the content handed back to Confucius conforms to
    # this schema. Cannot be combined with thinking: true (reasoning models do
    # not support structured output — use prompt-only constraints instead).
    # output_schema: |
    #   {
    #     "type": "object",
    #     "properties": { "verdict": { "type": "string", "enum": ["approved", "needs_revision", "insufficient"] } },
    #     "required": ["verdict"],
    #     "additionalProperties": false
    #   }
    # Transient-error retry (capability C). Liang (read-only) defaults to enabled
    # with the standard backoff; override here. Chongzhi (side-effecting) defaults
    # to disabled and is only retried before it executes any tool call.
    # retry:
    #   enabled: true
    #   max_attempts: 2        # total attempts including the first
    #   initial_backoff: 500ms
    #   max_backoff: 4s

tools:
  xizhi:
    read:
      enabled: true
    write:
      enabled: true
    modify:
      enabled: true
    list_files:
      enabled: true
    tree:
      enabled: true
    glob_files:
      enabled: true
  webfetch:
    enabled: true
    timeout: 30s
    # max_redirects: 10   # optional; HTTP redirect cap (default 10, 0/negative -> 10)

  # Per-user (workspace-resident) MCP tools: mcp_list_servers / mcp_add_server /
  # mcp_remove_server / mcp_call. Each user configures their own servers in
  # {workspaceRoot}/.blowball/mcp/config.json with HTTP transport + static
  # credentials. The family activates when any agent lists an mcp_* tool.
  user_mcp:
    # connect_timeout: 5s   # MCP handshake timeout (default 5s)
    # call_timeout: 10s     # total per mcp_call budget (default 10s)

  # Sandboxed command execution via bubblewrap (Linux only).
  # Requires bwrap to be installed and unprivileged user namespaces available.
  #
  # Operator tools: binaries placed in {data-dir}/tools are mounted read-only at
  # the in-sandbox $HOME/.local/bin (/home/blowball/.local/bin) and prepended to
  # PATH, so agents can invoke them by bare name. The sandbox always gets a real
  # writable $HOME (synthetic /home/blowball, forced regardless of
  # allowed_env_patterns) and $HOME/.local/bin as the first PATH entry, even when
  # the tools dir is empty. There is no config field for this; just drop files in
  # {data-dir}/tools (e.g. -d /var/lib/blowball -> /var/lib/blowball/tools).
  #
  # Fields:
  #   enabled              - required; set to true to register the tool.
  #   timeout              - optional; per-command timeout (default 30s).
  #   max_output_bytes     - optional; combined stdout/stderr cap (default 65536).
  #   allowed_env_patterns - optional; host env vars passed to the sandbox (default
  #                          PATH, HOME, LANG, USER, TERM, PYTHON*).
  #   network              - optional; when false the sandbox has no network access
  #                          via --unshare-net (default false).
  executor:
    bash:
      enabled: false
      timeout: 30s
      max_output_bytes: 65536
      allowed_env_patterns: ["PATH", "HOME", "LANG", "USER", "TERM"]
      network: false
    python:
      enabled: false
      timeout: 30s
      max_output_bytes: 65536
      allowed_env_patterns: ["PATH", "HOME", "LANG", "USER", "TERM", "PYTHON*"]
      network: false
    # Sandboxed Python package installation via pip (Linux only).
    # Requires bwrap and network access. Installed packages are persisted under
    # data/{userID}/workspace/.pip and are automatically available to the python
    # tool via PYTHONPATH.
    #
    # Fields:
    #   enabled              - required; set to true to register pip_install.
    #   timeout              - optional; per-command timeout (default 120s).
    #   max_output_bytes     - optional; combined stdout/stderr cap (default 65536).
    #   allowed_env_patterns - optional; host env vars passed to the sandbox.
    #   network              - optional; default true. Set to false to disable
    #                          network access (--unshare-net).
    #   index_url            - optional; PyPI mirror, e.g.
    #                          https://pypi.tuna.tsinghua.edu.cn/simple
    #   extra_index_urls     - optional; additional package indexes.
    #   trusted_hosts        - optional; hostnames passed to --trusted-host for
    #                          HTTP mirrors or self-signed HTTPS.
    pip:
      enabled: false
      timeout: 120s
      max_output_bytes: 65536
      allowed_env_patterns: ["PATH", "HOME", "LANG", "USER", "TERM", "PYTHON*"]
      network: true
      # index_url: https://pypi.tuna.tsinghua.edu.cn/simple
      # extra_index_urls:
      #   - https://extra.example.com/simple
      # trusted_hosts:
      #   - pypi.tuna.tsinghua.edu.cn

    # Per-command bwrap sandbox directory policy (Linux only). Applied to every
    # bash/python/pip_install command. The load-bearing invariants
    # (/workspace, synthetic $HOME, $HOME/.local/bin, skills targets, --chdir,
    # PYTHONPATH) are fixed and NOT configurable here. Omit the whole block for
    # byte-for-byte pre-configurability behavior (defaults below).
    #
    # Fields:
    #   system_read_only - optional; read-only system baseline, stat-guarded (a
    #                      missing entry e.g. /lib64 on aarch64 is skipped rather
    #                      than failing bwrap startup). Defaults to
    #                      [/usr, /bin, /lib, /lib64, /etc]. Override for
    #                      non-standard distros (e.g. NixOS).
    #   extra_read_only  - optional; operator read-only datasets/models. Each
    #                      entry is "host" (sandbox target == host) or
    #                      "host:target" (custom in-sandbox path, like docker -v).
    #   extra_read_write - optional; operator writable caches, same forms.
    #                      "/" is rejected; targets must not collide with the
    #                      fixed invariants or system baseline.
    sandbox:
      system_read_only: ["/usr", "/bin", "/lib", "/lib64", "/etc"]
      extra_read_only: []
      # extra_read_only examples:
      #   - "/opt/models"                 # bind /opt/models read-only at /opt/models
      #   - "/srv/datasets:/data"         # bind host /srv/datasets read-only at /data
      extra_read_write: []
      # extra_read_write example:
      #   - "/srv/cache"                  # bind /srv/cache read-write at /srv/cache

# External MCP servers. Tools discovered from these servers are registered in
# the process-wide tool registry and exposed through GET /api/v1/mcp/tools.
# Only explicitly-configured servers are connected; there is no runtime
# discovery.
#
# Transport types:
#   sse   - connects to a remote MCP server over SSE + HTTP POST messages.
#   stdio - spawns a local command and speaks JSON-RPC over stdin/stdout.
#   http  - connects to a remote MCP server over Streamable HTTP with
#           automatic Mcp-Session-Id management.
#
# Authentication:
#   SSE and HTTP auth use the headers map (supports ${VAR} substitution).
#   stdio auth uses the env map, injected into the child environment.
#
# Fields:
#   name         - required, unique identifier for this server.
#   transport    - required, "sse", "stdio" or "http".
#   url          - required for sse and http; server endpoint.
#   command      - required for stdio; executable to spawn.
#   args         - optional command-line arguments for stdio.
#   env          - optional environment variables for stdio.
#   headers      - optional HTTP headers for sse and http.
#   timeout      - optional connection / initialization timeout (default 30s).
#   call_timeout - optional per-tool-call timeout (default 30s).
#   reconnect    - optional, attempt reconnect/restart on failure.
#   prefix       - optional prefix applied to every discovered tool name.
mcp:
  servers:
    - name: remote_search
      transport: sse
      url: http://localhost:3001/sse
      headers:
        Authorization: Bearer ${MCP_TOKEN}
      timeout: 30s
      call_timeout: 30s
      reconnect: true

    - name: local_calculator
      transport: stdio
      command: ./calculator-mcp-server
      args: ["--stdio"]
      env:
        API_KEY: ${LOCAL_API_KEY}
      timeout: 30s
      call_timeout: 30s
      reconnect: true

    - name: remote_http_search
      transport: http
      url: http://localhost:3002/mcp
      headers:
        Authorization: Bearer ${MCP_TOKEN}
      timeout: 30s
      call_timeout: 30s
      reconnect: true

logging:
  level: info
  # Encoding for every enabled sink: "json" (default) or "console".
  format: json
  # Log sinks. Recognized values: "stderr", "stdout" (console) and "file"
  # (rotated file under {data-dir}/logs). Defaults to ["stderr", "file"].
  # Set just ["stderr"] to run console-only with no on-disk log file.
  output:
    - stderr
    - file
  # Rotation settings for the file sink (lumberjack). Fields left at zero fall
  # back to the defaults shown here. max_size_mb is the per-file size that
  # triggers a rotation; max_backups bounds how many rotated backups are kept;
  # max_age_days deletes backups older than N days; compress gzip-compresses
  # rotated backups (off by default).
  file:
    max_size_mb: 100
    max_backups: 7
    max_age_days: 30
    # compress: true
