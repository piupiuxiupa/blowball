# blowball backend configuration.
# Values support ${VAR} substitution from environment variables.

server:
  # Listen port for the api role and the all role (the all role serves the full
  # route set on a single listener).
  port: 8080
  # Listen port for the agent role (used only when running with --role agent).
  # Defaults to 8081 when omitted.
  agent_port: 8081

openai:
  api_key: ${OPENAI_API_KEY}
  base_url: https://api.openai.com/v1
  # Title-generation model (model-effort-v2, renamed from the legacy
  # openai.model): the model used ONLY by the async TitleService. It does not
  # have to appear in the models catalog below; unset → the default catalog
  # entry. Title calls always run on the non-thinking wire family (plain
  # max_tokens, no reasoning_effort).
  title_model: gpt-4o-mini
  # Deployment-level default thinking effort (model-effort-v2): the single
  # configuration source for the effort axis, overridden per request by the
  # POST /messages `reasoning_effort` parameter. Closed set
  # none|low|medium|high|xhigh|max; unset (the default) → none. On a
  # thinking:false catalog entry a non-none default is clamped to none (WARN)
  # and the turn proceeds; a non-none default also fails config load when any
  # agent configures output_schema (structured output × reasoning conflict).
  default_reasoning_effort: none
  # Stream idle watchdog (llm-stream-watchdog capability): the maximum allowed
  # gap between consecutive SSE frames of a streaming chat call. The first gap
  # starts when the call is issued, so time-to-first-frame is covered too — a
  # gateway that completes the HTTP handshake but never sends a frame also
  # trips it. It bounds frame INTER-ARRIVAL only, never total duration: a
  # stream that keeps emitting frames (even empty/usage/reasoning deltas)
  # runs as long as it needs. When no frame arrives within the window the
  # call aborts with a typed error that the existing transient-error retry
  # path classifies as retryable ("timeout"), instead of hanging the turn
  # forever on a silently-stalled connection. Recommended 2m: healthy
  # gateways stream deltas at millisecond cadence, so multi-minute silence
  # means the stream broke. Zero/unset (the default) disables the watchdog —
  # prior behavior exactly (a negative value fails config load).
  stream_idle_timeout: 2m
  # Model catalog (per-request-model-selection; MANDATORY since
  # model-effort-v2 — the config no longer loads without it): the list of
  # models a chat request may select via the POST /messages body parameters
  # `model` (a catalog name; unknown → 400 INVALID_MODEL) and
  # `reasoning_effort` (none|low|medium|high|xhigh|max). Resolution is two
  # independent axes: model = request || default entry, effort = request ||
  # default_reasoning_effort. Agents no longer carry model fields — the
  # resolved values are injected into every agent of the turn. Each entry's
  # max_context_tokens is that model's context window — the
  # context-compaction threshold follows the request-selected model (0.8 ×
  # its window), and turn_usage.model records the resolved name per turn.
  # max_completion_tokens is that model's OUTPUT-token quota
  # (per-model-completion-budget) — one turn, one model, one quota shared by
  # Confucius/Chongzhi/Liang (wrap-up rounds included). The field's semantic
  # is "output quota" and the wire family translates it: a thinking:true
  # entry sends it as max_completion_tokens, a thinking:false entry sends it
  # as the legacy max_tokens parameter (an acknowledged naming awkwardness —
  # the wire family owns the translation).
  # Entries need unique non-empty names, positive-integer windows and
  # positive-integer quotas; default_model (unset → the first entry) must
  # name a catalog entry. The optional per-entry length_continue sub-block
  # (see below) enables finish_reason=length continuation for that entry
  # only.
  # Migration from the pre-model-effort-v2 layout (load now REJECTS the old
  # keys with a pointed error): openai.model → openai.title_model (if it only
  # served titles); top-level openai.max_context_tokens → the per-entry
  # max_context_tokens; agents.<name>.model|thinking|reasoning_effort →
  # deleted (a uniform effort level moves to default_reasoning_effort).
  # Migration from the pre-per-model-completion-budget layout (same
  # fail-fast): agents.<name>.max_tokens → the per-entry
  # max_completion_tokens (the three agents usually shared one value — move
  # it to every entry); the global openai.length_continue block → the
  # per-entry length_continue sub-block on ONLY the models that need it.
  models:
    - name: gpt-5
      max_context_tokens: 400000
      max_completion_tokens: 16384
      thinking: true
      # finish_reason=length auto-continuation (llm-length-continuation
      # capability, per-entry since per-model-completion-budget): when a
      # round's LLM response is cut by the output token limit, keep the
      # partial output and continue with an expanded budget instead of
      # silently ending the turn. Attempt N (0-based) sends this entry's
      # max_completion_tokens + N × expand_step; up to max_retries
      # CONTINUATIONS per round (3 → 4 total attempts; continuation attempts
      # do not consume max_rounds). A truncated tool_call is not executed —
      # it gets a synthetic not-executed result instructing the model to
      # re-issue in smaller chunks, while calls whose arguments are complete
      # dispatch normally. If every attempt still ends length, the turn fails
      # with agent_error length_exhausted (finalContent keeps the accumulated
      # partial output). Applies to the three agent loops and round-cap
      # wrap-up rounds of turns that resolve to THIS entry; title generation
      # and compaction summaries are not covered. Zero/unset (the default)
      # disables the feature for this entry — length keeps terminating the
      # round silently (negative values fail config load). Any non-zero field
      # enables it with missing siblings defaulted (expand_step 8192,
      # max_retries 3).
      length_continue:
        expand_step: 8192
        max_retries: 3
    - name: glm-4.7
      max_context_tokens: 200000
      max_completion_tokens: 8192
      thinking: false
      # This entry configures no length_continue → continuation is off for
      # turns that select glm-4.7 (a length round terminates the turn).
  default_model: gpt-5

mysql:
  dsn: ${MYSQL_DSN:user:password@tcp(127.0.0.1:3306)/blowball?charset=utf8mb4&parseTime=true&loc=Local}
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""
  dbname: blowball

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

# Physical storage backend for the per-user data root ({data-dir}/data, which
# holds sessions/, workspace/ and per-user skills/). "local" (the default) uses
# each process's local disk — zero shared state, the only mode supported on
# macOS/Windows dev. "shared" declares that the operator has mounted a shared
# POSIX filesystem (MinIO-backed JuiceFS) onto {data-dir}/data BEFORE starting
# blowball, so api/agent instances across machines read/write one per-user data
# tree and gain DR backup. In shared mode the server runs a startup health check
# that refuses to boot if the mount is missing/wrong (preventing silent
# cross-node divergence); when executor tools are also enabled it additionally
# self-checks that JuiceFS was mounted with --allow-other.
#
# shared-mode prerequisites (Linux only): see docs/shared-storage.md —
#   * JuiceFS formatted against a MinIO bucket + a DEDICATED metadata engine
#     (independent Redis/DB, NOT blowball's session cache).
#   * /etc/fuse.conf with user_allow_other enabled.
#   * a systemd mount unit mounting JuiceFS onto {data-dir}/data with
#     --allow-other, Before=/Requires= the blowball service.
#   * when enabling executor tools, the mount MUST use --allow-other so bwrap's
#     user-namespace-mapped uid can write /workspace.
storage:
  workspace:
    backend: local  # local (default) | shared

# Redis-first write-behind message persistence (message-write-behind
# capability). Every turn's message batch is dual-written into Redis (the
# msgs:{session_id} read cache + the global msgs:buffer ingest queue) in one
# pipeline; a background flusher (agent/all roles only) then batch-inserts the
# queue into MySQL idempotently. These knobs tune that flusher. Omit the whole
# block for the defaults; explicit negative values are rejected at load.
#
# DEPLOYMENT PREREQUISITE: with the queue as the only synchronous layer, Redis
# must run with AOF persistence (appendonly yes) — a bare-restart Redis loses
# the messages still sitting in the flush window. The server probes
# appendonly at startup and WARNs when it is off.
#
# Fields:
#   flush_interval  - optional; ticker bounding how long a persisted message
#                     can sit in the queue before landing in MySQL (default
#                     1s). Also the read-your-writes window of the message
#                     history endpoint; the SSE stream itself is unaffected.
#   flush_batch_size - optional; records claimed per flush round, and the
#                     queue-length threshold that triggers an early flush
#                     between ticks (default 100).
#   max_input_tokens - optional; caps the ESTIMATED token count of a user
#                     message on POST /sessions/:id/messages
#                     (add-input-token-limit; CJK-aware heuristic, NOT exact
#                     tokenizer accounting). Over-limit requests get 400
#                     CONTENT_TOO_LONG before any storage or LLM work. Unset
#                     → default 5000; explicit 0 disables the token check (the
#                     1MB request-body cap stays in force); negative fails
#                     config load. Raise it if users legitimately paste large
#                     documents/code.
messages:
  flush_interval: 1s
  flush_batch_size: 100
  # max_input_tokens: 5000

# Cross-session long-term memory backed by an external OpenViking server
# (cross-session-memory capability; auto-only v1: recall at turn start,
# capture at turn end — the model makes zero tool calls). Default OFF: omit
# the whole block (or keep enabled: false) for zero behavior change.
#
# Per-user isolation rides the X-OpenViking-User header derived from the
# authenticated user_id: one operator api_key + account serve the whole
# deployment, and the server enforces path-based tenant isolation. api_key
# may be empty against a local no-auth server (openviking-server without
# auth configured).
memory:
  enabled: false
  base_url: ${MEMORY_BASE_URL:http://127.0.0.1:1933}
  api_key: ${MEMORY_API_KEY:}
  account: blowball
  # recall_limit: 6             # memories fetched per recall
  # recall_token_budget: 2000   # aggregate cap (CJK-aware estimate) of the injected block
  # recall_timeout: 2s          # recall deadline (turn-start path; keep small)
  # capture_timeout: 30s        # capture deadline (detached goroutine)
  # max_capture_bytes: 262144   # per-message byte cap (256KB), truncate with marker

# Remote-authorized skill market (skill-market capability). Default OFF: omit
# the whole block (or leave url empty/uncommented) for zero behavior change —
# a non-empty url IS the on switch (no separate `enabled` flag).
#
# When enabled, blowball fetches the per-user skill allowlist from the market
# service using the CALLER's login JWT (Authorization: Bearer; the market
# service resolves the user identity from the token, so it must validate
# blowball JWTs — shared jwt.secret domain). Skill payloads are NOT fetched:
# the operator syncs them onto every host at
# {data-dir}/skills-market/{market_user_id}/{skill_name}/, and blowball only
# ever exposes the paths the allowlist returns. Any fetch failure (down,
# timeout, non-200, bad JSON, auth failure) degrades fail-closed: no market
# skills in any list, no reads, no sandbox mounts — NEVER a directory-scan
# fallback.
#
# Fields:
#   url       - the allowlist endpoint (absolute http(s) URL). Empty = off.
#   timeout   - optional; per-fetch deadline (default 5s).
#   cache_ttl - optional; per-user allowlist cache window; also the bound on
#               how long a revoked skill stays visible (default 60s).
skill_market:
  # url: ${SKILL_MARKET_URL:}
  # timeout: 5s
  # cache_ttl: 60s

# Process-level Landlock sandbox (Linux only; no-op on macOS/Windows). Applied
# once at startup over the server process. The process RW application dirs
# ({data-dir}/data, {data-dir}/logs, {data-dir}/skills) and RO dir
# ({data-dir}/tools) are derived from -d and are NOT configurable here; this
# block only extends the system baseline and adds extra dirs. Omit the whole
# block for byte-for-byte pre-configurability behavior (defaults below).
#
# Fields:
#   enabled          - optional; default true. Set false to skip ApplyLandlock
#                      entirely (warning-only; application-layer path validation
#                      still enforces per-user workspace isolation).
#   system_read_only - optional; read-only system baseline, stat-guarded (a
#                      missing entry e.g. /lib64 on aarch64 is skipped with a
#                      warning rather than failing). Defaults to
#                      [/etc, /usr, /bin, /lib, /lib64, /proc]. Override for
#                      non-standard distros (e.g. NixOS).
#   extra_read_write - optional; extra absolute process read-write dirs.
#   extra_read_only  - optional; extra absolute process read-only dirs.
landlock:
  enabled: true
  system_read_only: ["/etc", "/usr", "/bin", "/lib", "/lib64", "/proc"]
  extra_read_write: []
  extra_read_only: []

# Login policy. When password_required is true (the default when omitted), the
# /api/v1/auth/login endpoint verifies the password against the seed-created
# bcrypt hash. Set it to false for passwordless login: any seeded, active user
# can log in by username alone (the password, if sent, is ignored).
auth:
  password_required: true

jwt:
  secret: ${JWT_SECRET}
  expire: 7d

# OnlyOffice DocumentServer integration for editing office files (docx/xlsx/pptx).
# When omitted entirely the editor endpoints return 503 (read-only rendering is
# unaffected). Secret MUST match the DocumentServer local.json secret used for
# browser/inbox/outbox JWT verification, or the editor will reject the signed
# config. This is a DIFFERENT secret from jwt.secret above — they are independent
# and must never be swapped. Note: this is NOT blowball's config.yaml jwt.secret.
onlyoffice:
  # Shared OnlyOffice JWT secret. Must equal the value in the DocumentServer
  # container's local.json (token.secret.browser/inbox/outbox). Leave empty to
  # disable editing (endpoints return 503).
  secret: ${ONLYOFFICE_SECRET}
  # Browser-facing origin the editor loads api.js from, AND the host allowlist
  # base for callback result URLs (SSRF mitigation). Use http://localhost (NOT a
  # LAN IP) when the browser runs on the same machine as the DocumentServer so
  # the editor's websocket isn't routed through a proxy. Defaults to http://localhost.
  server_url: http://localhost
  # Origin the DocumentServer CONTAINER uses to reach the blowball backend (it
  # cannot reach the browser-facing http://localhost:8080). Used to build
  # document.url and the save callbackUrl. Must be an address the container can
  # actually route to that serves the blowball API.
  internal_backend: ${ONLYOFFICE_INTERNAL_BACKEND:http://127.0.0.1:8080}
  # Base URL of the external office-vers service (MinIO-backed versioned file
  # storage, deployed on a private network). The historical-version view config
  # endpoint (GET .../onlyoffice-version-config?versionId=) points document.url
  # at {version_service_url}/documents/{userUUID}/{path}?action=version&versionId=.
  # Leave empty to disable the version-view endpoint (it returns 503); the
  # edit/view config endpoint above is unaffected and needs only secret.
  version_service_url: ${ONLYOFFICE_VERSION_SERVICE_URL:}

agents:
  confucius:
    name: Confucius
    system_prompt: |
      You are the root planning agent. Decompose work, dispatch generic
      sub-agents, verify their results, and synthesize the final answer.

      Core Principles
      - Small, bounded, unambiguous tasks are often faster to complete yourself.
      - Spawn sub-agents for parallel, bounded, independently verifiable work.
      - A sub-agent sees only the task prompt you send it. Include all paths,
        error text, acceptance criteria, and constraints in that prompt.
      - Prefer reusable skills and tools; describe the exact tool scope when it
        helps keep a task read-only.
      - Keep write sets disjoint when dispatching parallel sub-agents.
      - Serialize dependent work; do not resume or revise an instance until its
        preceding result is available.

      Plan Discipline
      - For non-trivial multi-step work, call update_plan before dispatch and keep the plan current as work progresses.
      - Submit a complete plan snapshot every time; mark every independent step being dispatched now as in_progress.
      - The rendered plan is visible to the user, so do not duplicate the full plan in ordinary prose.
      - A sub-agent status is execution evidence, not semantic completion. Verify the result before marking a plan step completed.
      - Give a sub-agent only the relevant plan step, acceptance criteria, constraints, paths, dependencies, and prior results—not the entire root plan or sibling state.

      Dispatch Discipline
      - Emit independent spawn_subagent calls together in one assistant turn.
      - Bound every plan; do not spawn for trivia or highly serial steps.
      - Give each instance a short name and a self-contained task.
      - Narrow tools to the minimum the task needs; never request a tool outside
        your own effective tool set.
      - A result marked `status: capped` can be continued by passing its
        agent_id as resume_agent_id with a precise follow-up task.
      - A result marked `status: error` may still contain partial output; read it
        before deciding whether to resume, retry differently, or abandon.
    # (max_tokens was removed by per-model-completion-budget: the output
    # quota now lives on each openai.models catalog entry as
    # max_completion_tokens.)
    tools:
      - luban_list_skills
      - luban_read_skill
      - luban_install_skill
      # Per-user MCP tools (mcp_list_servers / mcp_add_server /
      # mcp_remove_server / mcp_call) let this agent manage and call the user's
      # own MCP servers declared in their workspace.
      # - mcp_list_servers
      # - mcp_add_server
      # - mcp_remove_server
      # - mcp_call


    # Optional: declare MCP servers and tools this agent may use.
    mcp:
      servers:
        - name: remote_search
          tools:
            - "*"
    # Optional: declare skills this agent may use.
    skills:
      - coding-style

  subagent:
    name: Subagent
    system_prompt: |
      You are a generic Blowball sub-agent. Complete only the task supplied by
      your parent agent, using the tools explicitly available to you.

      - Treat the task prompt as self-contained; ask for missing facts only by
        returning a precise request in your final answer.
      - Prefer available skills and tools over manual work; keep changes minimal.
      - Verify side effects when possible, then return a concise, reproducible
        result with the exact paths, commands, and evidence used.
      - Do not communicate with sibling sub-agents. Coordination belongs to the
        parent, which will pass on any information you need.
    # max_rounds: 100  # tool-calling loop cap (unset → default 100). A capped
    #                  # run can be resumed with spawn_subagent.resume_agent_id.
    # Generic defaults are inherited by every spawn; the runtime may narrow them
    # but can never expand beyond the parent agent's effective tool set.
    tools:
      - xizhi_read_file
      - xizhi_write_file
      - xizhi_modify_file
      - xizhi_list_files
      - xizhi_tree
      - xizhi_find
      - xizhi_grep
      - xizhi_delete
      - webfetch
      - luban_list_skills
      - luban_read_skill
      - luban_install_skill
      - bash
    mcp:
      servers: []
    skills: []
    # Tree topology budgets. max_depth=1 is the historical flat topology:
    # child agents do not receive spawn_subagent. max_concurrent includes all
    # descendants and ancestors waiting on descendants, so it must remain
    # greater than max_depth to prevent synchronous nested-dispatch deadlock.
    max_depth: 1
    max_concurrent: 4
    max_total_per_turn: 12
    # Persisted history snapshots larger than this remain visible/event-attributed
    # but are marked ineligible for resume (1 MiB by default).
    max_snapshot_bytes: 1048576
    # Optional dispatch templates. They are pure defaults — explicit spawn tools
    # override a preset, and every listed tool is still subset-checked.
    # presets:
    #   writer:
    #     system_prompt: |
    #       Modify files carefully and verify every write.
    #     tools: [xizhi_read_file, xizhi_write_file, xizhi_modify_file]
    #   reader:
    #     system_prompt: |
    #       Analyze the supplied scope and report evidence without modifying it.
    #     tools: [xizhi_read_file, xizhi_list_files, xizhi_tree, xizhi_find, xizhi_grep]
    # Structured output and retry use the same AgentConfig fields as before.
    # output_schema: |
    #   {"type":"object","properties":{"result":{"type":"string"}},"required":["result"],"additionalProperties":false}
  # retry:
  #   enabled: true
  #   max_attempts: 3
  #   initial_backoff: 500ms
  #   max_backoff: 4s

tools:
  xizhi:
    read:
      enabled: true
    write:
      enabled: true
    modify:
      enabled: true
    list_files:
      enabled: true
    tree:
      enabled: true
    find:
      enabled: true   # enables xizhi_find (regex name search for files AND directories with type/depth filters and pagination); also add "xizhi_find" to an agent's tools list to use it
    delete:
      enabled: true   # enables xizhi_delete; also add "xizhi_delete" to an agent's tools list to use it
    grep:
      enabled: true   # enables xizhi_grep (RE2 content search with glob filter, line numbers, context lines); also add "xizhi_grep" to an agent's tools list to use it
  webfetch:
    enabled: true
    timeout: 30s
    # max_redirects: 10   # optional; HTTP redirect cap (default 10, 0/negative -> 10)

  # Per-tool execution timeouts (capability: tool-execution-timeout). Maps a
  # built-in tool name (the same identifier agents list under their tools:) to a
  # per-invocation budget, enforced centrally at the registry dispatch entry
  # point. A tool mapped to a positive duration is bounded by it on every call;
  # an absent entry or zero/negative duration is unbounded (the prior behavior).
  # For remote tools that already have a native timeout (webfetch / bash /
  # per-user mcp) this acts as a looser outer backstop — set it LOOSER than the
  # native one so the tighter (native) bound fires first. Opt-in per tool; no
  # global default is applied.
  # timeouts:
  #   xizhi_grep: 30s
  #   xizhi_tree: 15s
  #   xizhi_list_files: 10s
  #   xizhi_find: 15s
  #   webfetch: 30s
  #   bash: 120s

  # Per-user (workspace-resident) MCP tools: mcp_list_servers / mcp_add_server /
  # mcp_remove_server / mcp_call / mcp_list_tools. Each user configures their own
  # servers in {workspaceRoot}/.blowball/mcp/{name}/config.json (one directory
  # per server) with HTTP transport + static credentials. The family activates
  # when any agent lists an mcp_* tool.
  user_mcp:
    # connect_timeout: 5s   # MCP handshake timeout (default 5s)
    # call_timeout: 10s     # total per mcp_call budget (default 10s)
    # Inline cap for mcp_call results (mcp-call-result-spill). Over the cap the
    # full result is saved to tmp/mcp-outputs/ in the user's workspace and the
    # model gets a small path+preview envelope (read it back with
    # xizhi_read_file / xizhi_grep). Tokens are a conservative CJK-aware
    # estimate, never exact. Unset → 20000; explicit 0 disables the automatic
    # spill (the model's explicit output_path still spills); negative fails load.
    # max_inline_result_tokens: 20000

  # Sandboxed command execution via bubblewrap (Linux only).
  # Requires bwrap to be installed and unprivileged user namespaces available.
  #
  # The dedicated python/pip_install executors were removed; run Python code
  # and pip installs through bash (e.g. `python3 ...`,
  # `python3 -m pip install --target /workspace/.pip <pkg>`). The persistent
  # PYTHONPATH=/workspace/.pip bridge is still injected into every bash sandbox,
  # so packages installed by pip-via-bash are importable by later python3 runs.
  #
  # Operator tools: binaries placed in {data-dir}/tools are mounted read-only at
  # the in-sandbox $HOME/.local/bin (/home/blowball/.local/bin) and prepended to
  # PATH, so agents can invoke them by bare name. The sandbox always gets a real
  # writable $HOME (synthetic /home/blowball, forced regardless of
  # allowed_env_patterns) and $HOME/.local/bin as the first PATH entry, even when
  # the tools dir is empty. There is no config field for this; just drop files in
  # {data-dir}/tools (e.g. -d /var/lib/blowball -> /var/lib/blowball/tools).
  #
  # Fields:
  #   enabled              - required; set to true to register the tool.
  #   timeout              - optional; per-command timeout (default 30s).
  #   max_output_bytes     - optional; combined stdout/stderr cap (default 65536).
  #   allowed_env_patterns - optional; host env vars whose VALUE travels from the
  #                          host process (glob via filepath.Match, so PYTHON*
  #                          matches PYTHONPATH/PYTHONHOME). Default PATH, HOME,
  #                          LANG, USER, TERM, PYTHON*. Lowest env tier.
  #   env                  - optional; operator env literals (KEY: value map)
  #                          injected into every bash sandbox as literal values,
  #                          overriding same-named allowed_env_patterns vars. Best
  #                          for shared, operator-owned config (pip/npm mirrors,
  #                          corporate proxies, feature flags). Values expand
  #                          ${VAR} / ${VAR:default} from the host like any config
  #                          string, so reference secrets via ${SECRET} instead of
  #                          hard-coding them. HOME is reserved (rejected at load);
  #                          key names must match ^[A-Za-z_][A-Za-z0-9_]*$. Middle
  #                          env tier.
  #   network              - optional; defaults to true so pip-via-bash
  #                          (python3 -m pip install) can reach PyPI out of the
  #                          box. Set to false to disable network access
  #                          (--unshare-net) and tighten the sandbox.
  #
  #   Env precedence (low -> high): host allowlist (allowed_env_patterns) <
  #   env literals (env) < forced invariants (HOME forced to the synthetic sandbox
  #   home, $HOME/.local/bin prepended to PATH, /workspace/.pip prepended to
  #   PYTHONPATH). The forced tier always wins, so the load-bearing invariants
  #   cannot be weakened by operator config.
  executor:
    bash:
      enabled: false
      timeout: 30s
      max_output_bytes: 65536
      allowed_env_patterns:
        - "PATH"
        - "HOME"
        - "LANG"
        - "USER"
        - "TERM"
        - "PYTHON*"
      # env: operator-owned literals injected into every bash sandbox. Prefer
      # this over host-export + allowed_env_patterns for shared config so
      # config.yaml is the single source of truth. Values expand ${VAR}.
      # env:
      #   PIP_INDEX_URL: "https://pypi.mirrors.example.com/simple"
      #   PIP_TRUSTED_HOST: "pypi.mirrors.example.com"
      #   npm_config_registry: "https://npm.mirrors.example.com"
      #   # Corporate proxy — set both cases, and include the mirror host in
      #   # NO_PROXY so internal mirror traffic bypasses the proxy.
      #   HTTP_PROXY:  "${CORP_PROXY}"
      #   http_proxy:  "${CORP_PROXY}"
      #   HTTPS_PROXY: "${CORP_PROXY}"
      #   https_proxy: "${CORP_PROXY}"
      #   NO_PROXY:  "localhost,127.0.0.1,pypi.mirrors.example.com"
      #   no_proxy:  "localhost,127.0.0.1,pypi.mirrors.example.com"
      #   NODE_USE_ENV_PROXY: "1"
      network: true

    # Per-command bwrap sandbox directory policy (Linux only). Applied to every
    # bash command. The load-bearing invariants
    # (/workspace, synthetic $HOME, $HOME/.local/bin, skills targets, --chdir,
    # PYTHONPATH) are fixed and NOT configurable here. Omit the whole block for
    # byte-for-byte pre-configurability behavior (defaults below).
    #
    # Fields:
    #   system_read_only - optional; read-only system baseline, stat-guarded (a
    #                      missing entry e.g. /lib64 on aarch64 is skipped rather
    #                      than failing bwrap startup). Defaults to
    #                      [/usr, /bin, /lib, /lib64, /etc]. Override for
    #                      non-standard distros (e.g. NixOS).
    #   extra_read_only  - optional; operator read-only datasets/models. Each
    #                      entry is "host" (sandbox target == host) or
    #                      "host:target" (custom in-sandbox path, like docker -v).
    #   extra_read_write - optional; operator writable caches, same forms.
    #                      "/" is rejected; targets must not collide with the
    #                      fixed invariants or system baseline.
    sandbox:
      system_read_only: ["/usr", "/bin", "/lib", "/lib64", "/etc"]
      extra_read_only: []
      # extra_read_only examples:
      #   - "/opt/models"                 # bind /opt/models read-only at /opt/models
      #   - "/srv/datasets:/data"         # bind host /srv/datasets read-only at /data
      extra_read_write: []
      # extra_read_write example:
      #   - "/srv/cache"                  # bind /srv/cache read-write at /srv/cache

# External MCP servers. Tools discovered from these servers are registered in
# the process-wide tool registry and exposed through GET /api/v1/mcp/tools.
# Only explicitly-configured servers are connected; there is no runtime
# discovery.
#
# Transport types:
#   sse   - connects to a remote MCP server over SSE + HTTP POST messages.
#   stdio - spawns a local command and speaks JSON-RPC over stdin/stdout.
#   http  - connects to a remote MCP server over Streamable HTTP with
#           automatic Mcp-Session-Id management.
#
# Authentication:
#   SSE and HTTP auth use the headers map (supports ${VAR} substitution).
#   stdio auth uses the env map, injected into the child environment.
#
# Fields:
#   name         - required, unique identifier for this server.
#   transport    - required, "sse", "stdio" or "http".
#   url          - required for sse and http; server endpoint.
#   command      - required for stdio; executable to spawn.
#   args         - optional command-line arguments for stdio.
#   env          - optional environment variables for stdio.
#   headers      - optional HTTP headers for sse and http.
#   timeout      - optional connection / initialization timeout (default 30s).
#   call_timeout - optional per-tool-call timeout (default 30s).
#   reconnect    - optional, attempt reconnect/restart on failure.
#   prefix       - optional prefix applied to every discovered tool name.
mcp:
  servers:
    - name: remote_search
      transport: sse
      url: http://localhost:3001/sse
      headers:
        Authorization: Bearer ${MCP_TOKEN}
      timeout: 30s
      call_timeout: 30s
      reconnect: true

    - name: local_calculator
      transport: stdio
      command: ./calculator-mcp-server
      args: ["--stdio"]
      env:
        API_KEY: ${LOCAL_API_KEY}
      timeout: 30s
      call_timeout: 30s
      reconnect: true

    - name: remote_http_search
      transport: http
      url: http://localhost:3002/mcp
      headers:
        Authorization: Bearer ${MCP_TOKEN}
      timeout: 30s
      call_timeout: 30s
      reconnect: true

logging:
  level: info
  # Encoding for every enabled sink: "json" (default) or "console".
  format: json
  # Log sinks. Recognized values: "stderr", "stdout" (console) and "file"
  # (rotated file under {data-dir}/logs). Defaults to ["stderr", "file"].
  # Set just ["stderr"] to run console-only with no on-disk log file.
  output:
    - stderr
    - file
  # Rotation settings for the file sink (lumberjack). Fields left at zero fall
  # back to the defaults shown here. max_size_mb is the per-file size that
  # triggers a rotation; max_backups bounds how many rotated backups are kept;
  # max_age_days deletes backups older than N days; compress gzip-compresses
  # rotated backups (off by default).
  file:
    max_size_mb: 100
    max_backups: 7
    max_age_days: 30
    # compress: true
